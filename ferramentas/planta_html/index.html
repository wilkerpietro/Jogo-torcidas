<title>Planta da Cidade do Estádio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --papel: #e8eae4;
  --folha: #f6f7f3;
  --tinta: #1d2420;
  --tinta-2: #56605a;
  --linha: #c7ccc4;
  --acento: #0e7a82;
  --acento-fundo: rgba(14, 122, 130, .12);
  --selecao: #d4731c;
  --ceu3d: #dfe6ea;
  --chao3d: #b9b8ae;
  --f-ui: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-texto: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-dado: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #121615; --folha: #1a1f1e; --tinta: #e2e7e3; --tinta-2: #9ba59f; --linha: #2d3534;
    --acento: #45b6be; --acento-fundo: rgba(69, 182, 190, .16); --selecao: #f09c45;
    --ceu3d: #1d2529; --chao3d: #3b3e39;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #121615; --folha: #1a1f1e; --tinta: #e2e7e3; --tinta-2: #9ba59f; --linha: #2d3534;
  --acento: #45b6be; --acento-fundo: rgba(69, 182, 190, .16); --selecao: #f09c45;
  --ceu3d: #1d2529; --chao3d: #3b3e39;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--papel); color: var(--tinta); font: 14px/1.45 var(--f-texto); }
.app {
  box-sizing: border-box; height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-inline: 16px; padding-block: 12px;
}
.topo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.nome h1 {
  margin: 0; font: 700 24px/1.05 var(--f-ui); letter-spacing: .01em; text-wrap: balance;
}
.resumo { margin: 3px 0 0; font: 12px/1.3 var(--f-dado); color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.controles { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.modos { display: inline-flex; border: 1px solid var(--linha); border-radius: 8px; padding: 2px; background: var(--folha); }
.modos button {
  font: 600 14px/1 var(--f-ui); letter-spacing: .02em; color: var(--tinta-2); background: none;
  border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer;
}
.modos button[aria-selected="true"] { background: var(--tinta); color: var(--papel); }
.modos button#aba-proposta[aria-selected="true"] { background: var(--acento); color: var(--folha); }
.camadas { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 13px/1 var(--f-ui); color: var(--tinta-2); }
.camadas label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.camadas input { accent-color: var(--acento); margin: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--selecao); outline-offset: 2px; }

.corpo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; }
.mapa {
  position: relative; min-height: 0; border-radius: 10px; overflow: hidden; background: #555;
  border: 1px solid var(--linha); touch-action: none; cursor: grab;
}
.mapa.arrastando { cursor: grabbing; }
.mapa canvas { display: block; width: 100%; height: 100%; }
.zoom { position: absolute; right: 10px; top: 30px; display: flex; flex-direction: column; gap: 4px; }
.zoom button {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(0,0,0,.35); cursor: pointer;
  background: rgba(246,247,243,.92); color: #1d2420; font: 600 18px/1 var(--f-ui);
}
.legenda {
  position: absolute; left: 30px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: calc(100% - 200px);
  padding: 6px 9px; border-radius: 8px; background: rgba(24,27,26,.78); color: #eef0ec;
  font: 500 12px/1.2 var(--f-ui); letter-spacing: .02em; pointer-events: none;
}
.legenda span { display: inline-flex; align-items: center; gap: 5px; }
.legenda i { width: 11px; height: 11px; border: 1px solid #111; display: inline-block; }
.legenda i.nova { border: 2px dashed #45b6be; background: transparent; }
.regua {
  position: absolute; right: 10px; bottom: 10px; padding: 5px 8px 6px; border-radius: 8px;
  background: rgba(24,27,26,.78); color: #eef0ec; font: 11px/1 var(--f-dado); pointer-events: none;
}
.regua b { display: block; height: 4px; margin-bottom: 4px; background: repeating-linear-gradient(90deg, #eef0ec 0 50%, #555 50% 100%); border: 1px solid #eef0ec; }
.coord {
  position: absolute; left: 30px; top: 30px; padding: 4px 8px; border-radius: 6px; background: rgba(24,27,26,.72);
  color: #eef0ec; font: 11px/1.2 var(--f-dado); pointer-events: none; font-variant-numeric: tabular-nums;
}
.aviso {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
  background: #555; color: #eef0ec; font: 600 16px/1.4 var(--f-ui); letter-spacing: .02em;
}
.dica-hover {
  position: absolute; pointer-events: none; padding: 4px 7px; border-radius: 6px; background: rgba(24,27,26,.88);
  color: #fff; font: 500 12px/1.25 var(--f-ui); white-space: nowrap; transform: translate(12px, 12px);
}

.painel { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.vista3d {
  position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--linha); background: var(--ceu3d);
  aspect-ratio: 4 / 3; max-width: 100%; flex: none;
}
.vista3d canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.dica { position: absolute; left: 8px; bottom: 6px; margin: 0; font: 500 11px/1 var(--f-ui); color: var(--tinta-2); pointer-events: none; }
.carregando3d { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px var(--f-ui); color: var(--tinta-2); pointer-events: none; }
.ficha, .notas { background: var(--folha); border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px; }
.sobre { margin: 0 0 4px; font: 600 12px/1.3 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.sobre .chip { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: var(--acento); color: var(--folha); letter-spacing: .04em; }
.ficha h2, .notas h2 { margin: 0 0 10px; font: 700 21px/1.15 var(--f-ui); text-wrap: balance; }
.dados { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.dados div { min-width: 0; }
.dados dt { font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.dados dd { margin: 2px 0 0; font: 13px/1.3 var(--f-dado); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.dados .largo { grid-column: 1 / -1; }
.nota { margin: 10px 0 0; color: var(--tinta-2); font-size: 13px; }
.notas h3 { margin: 14px 0 6px; font: 700 15px/1.2 var(--f-ui); letter-spacing: .02em; }
.notas p, .notas li { font-size: 13.5px; }
.notas ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.numeros div { border-left: 3px solid var(--acento); padding: 2px 0 2px 8px; }
.numeros dt { font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.numeros dd { margin: 2px 0 0; font: 600 17px/1.15 var(--f-dado); font-variant-numeric: tabular-nums; white-space: nowrap; }
.numeros small { font: 12px var(--f-dado); color: var(--tinta-2); }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  .corpo { grid-template-columns: minmax(0, 1fr); }
  .mapa { height: 62vh; min-height: 320px; }
  .legenda { left: 10px; max-width: calc(100% - 20px); bottom: 44px; }
  .coord { left: 10px; top: 10px; }
  .zoom { top: 10px; }
  .painel { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<div class="app">
  <header class="topo">
    <div class="nome">
      <h1>Planta da Cidade do Estádio</h1>
      <p class="resumo" id="resumo">carregando a planta…</p>
    </div>
    <div class="controles">
      <div class="modos" role="tablist" aria-label="O que mostrar">
        <button role="tab" id="aba-atual" aria-selected="true">Mapa atual</button>
        <button role="tab" id="aba-proposta" aria-selected="false">Proposta de expansão</button>
      </div>
      <div class="camadas">
        <label><input type="checkbox" id="c-rotulos" checked> Rótulos</label>
        <label><input type="checkbox" id="c-grade" checked> Grade</label>
        <label><input type="checkbox" id="c-arvores" checked> Árvores</label>
        <label><input type="checkbox" id="c-props" checked> Postes e props</label>
        <label><input type="checkbox" id="c-carros" checked> Carros</label>
      </div>
    </div>
  </header>
  <main class="corpo">
    <section class="mapa" id="mapa" aria-label="Mapa da cidade: arraste pra mover, role pra aproximar, clique num lote">
      <canvas id="cv"></canvas>
      <div class="zoom">
        <button id="z-mais" aria-label="Aproximar">+</button>
        <button id="z-menos" aria-label="Afastar">−</button>
        <button id="z-tudo" aria-label="Enquadrar a cidade">⤢</button>
      </div>
      <div class="coord" id="coord">x — · y —</div>
      <div class="legenda" id="legenda"></div>
      <div class="regua" id="regua"><b></b><span></span></div>
      <div class="dica-hover" id="hover" hidden></div>
      <div class="aviso" id="aviso">Montando a cidade…</div>
    </section>
    <aside class="painel">
      <div class="vista3d" id="vista3d">
        <canvas id="c3d"></canvas>
        <div class="carregando3d" id="carregando3d" hidden>montando…</div>

      </div>
      <div class="ficha" id="ficha">

        <h2>Clique num lote</h2>
        <p class="nota">Cada lote do mapa abre o imóvel em 3D, montado com o mesmo código do jogo.</p>
      </div>
      <div class="notas" id="notas" hidden></div>
    </aside>
  </main>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';
import { planoDaCasa, montarCasa, juntarBlocos, lugarDoDecalque } from './js/casas3d.js';
import { montarModelos } from './js/modelos3d.js';
import { moldeDaPeca, comTransformador } from './js/props3d.js';
import { ATLAS } from './js/modelos_atlas.js';
import { gerarProposta, RUA } from './js/proposta.js';

const $ = id => document.getElementById(id);
const aviso = $('aviso');

/* ======================================================
   A PLANTA DO JOGO, rodando aqui mesmo
   ====================================================== */
function carregarScript(src) {
  return new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = src; s.charset = 'utf-8'; s.onload = ok; s.onerror = () => erro(new Error(src));
    document.head.appendChild(s);
  });
}
window.TO = window.TO || { dados: {} };
try {
  await carregarScript('dados/torcidas.js');
  await carregarScript('dados/cena_estadio.js');
} catch (e) {
  aviso.textContent = 'A planta da cidade não carregou (' + e.message + '). Recarregue a página.';
  throw e;
}
const P = TO.dados.plantaEstadio, K = P.CIDADE, M = P.METRO, CALC = K.CALC;
const PROP = gerarProposta(P);

/* ======================================================
   OS NOMES
   ====================================================== */
const NOME_MODELO = {
  t1: 'Casa térrea de reboco', t2: 'Casa de tijolo à vista', t3: 'Casa com ponto de comércio',
  t4: 'Sobrado de laje com caixa-d’água', t5: 'Casarão colonial',
  g1: 'Galpão de platibanda', g2: 'Galpão de arco', p1: 'Prédio de reboco', p2: 'Prédio de tijolo',
  m1: 'Casa de muro com garagem coberta', m2: 'Casa de muro alto com torrinha',
  m3: 'Casa de muro com quintal na frente', m4: 'Casinha no meio do lote',
  favela: 'Casa da favela', f1: 'Casa de laje com terraço', f2: 'Casa rosa de quintal', bar: 'Bar da favela',
  lanche: 'Lanchonete da favela', escada: 'Casa da escada de fora', varal: 'Sobrado do varal',
  garagem: 'Casa das garagens', base: 'Casa do embasamento'
};
const NOME_TIPO = { casa: 'Casa', sobrado: 'Sobrado', galpao: 'Galpão', predio: 'Prédio', muro: 'Muro', barraco: 'Barraco' };
const NOME_MARCO = {
  igreja: 'Igreja Matriz', predio: 'Prédio alto do centro', loja: 'Prédio do mercado', adm: 'Centro Administrativo',
  casa: 'Casa de classe média', atacadex: 'Atacadex', torre1: 'Edifício Mirante', torre2: 'Residencial Bela Vista'
};
const NOME_EQUIP = {
  praca: 'Praça da Matriz', hospital: 'Hospital', delegacia: 'Delegacia', escola: 'Escola', posto: 'Posto de gasolina',
  shopping: 'Shopping Beira-Mar', galeria: 'Galeria', bar: 'Bar da torcida', sede: 'Sede da torcida',
  baldio: 'Bares do estádio'
};
const NOME_PROP = {
  cesto: 'Cesto de lixo', cacamba: 'Contêiner de lixo', lixeira: 'Lixeira de coleta seletiva', saco: 'Saco de lixo',
  caixa: 'Caixa de papelão', barreira: 'Barreira de concreto', correio: 'Caixa de correio', hidrante: 'Hidrante',
  balizador: 'Balizador', espuma: 'Balizador de espuma', delineador: 'Delineador', cone: 'Cone', cinzeiro: 'Cinzeiro',
  banco: 'Banco de madeira', poste: 'Poste de concreto'
};
const FRENTE = { n: 'norte', s: 'sul', o: 'oeste', l: 'leste', av: 'a avenida' };
const metros = v => (v / M).toLocaleString('pt-BR', { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + ' m';

/* ======================================================
   AS CORES DO DESENHO (as do diagrama da quadra)
   ====================================================== */
const COR = {
  mato: '#8a8866', moita: '#5f6b46', trilha: '#a8966c', beco: '#6c6c68',
  rua: '#555555', avenida: '#4a4a48', eixo: '#c9b96a', calcada: '#bbbbbb', miolo: '#999988',
  quintal: '#c9b98f', fundos: '#88aa77', pracinha: '#55aa55', areia: '#dccb9e', mar: '#3f6c84',
  estadio: '#a7a397', arquibancada: '#8a8780', pista: '#8f8b80', gramado: '#4f8f3f',
  arvore: 'rgba(0,120,0,.7)', carro: '#ee3333', poste: '#ffff00', marco: '#b39ad6', nova: '#45b6be'
};
const COR_LOTE = { casa: '#dd8888', sobrado: '#cc6666', galpao: '#8899aa', predio: '#7777aa', muro: '#aaaa88', barraco: '#c98a5a' };
const COR_FAVELA = { casa: '#d9a066', sobrado: '#c9804e', barraco: '#c98a5a', galpao: '#a88a6a' };
const COR_PROP = { cacamba: '#2f8f2f', lixeira: '#7f9fb0', saco: '#111', caixa: '#b88a50', cesto: '#d2b53a', barreira: '#e0e0e0',
                   correio: '#c33b27', hidrante: '#d33', balizador: '#e3b21f', espuma: '#e8cf36', delineador: '#e1701f',
                   cone: '#ea6a1c', cinzeiro: '#babcb9', banco: '#8f5d33' };

/* ======================================================
   O QUE SE CLICA
   ====================================================== */
const bbox = pts => {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return { x0, y0, x1, y1 };
};
const retPts = r => [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]];
function dentro(x, y, pol) {
  let d = false;
  for (let i = 0, j = pol.length - 1; i < pol.length; j = i++) {
    const [xi, yi] = pol[i], [xj, yj] = pol[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) d = !d;
  }
  return d;
}
const quadraDe = new Map();
for (const q of K.QUADRAS) for (const l of q.lotes) quadraDe.set(l, q);

/* K.LOTES já traz a beira da estrada e a favela junto com os lotes de quadra */
const naBeira = new Set(K.BEIRA);
const lotes = [];
for (const l of K.LOTES) { const pol = K.cantosDoLote(l).slice(0, 4); lotes.push({ tipo: 'lote', l, pol, bb: bbox(pol), q: quadraDe.get(l), beira: naBeira.has(l) }); }
const nLotesQuadra = K.QUADRAS.reduce((n, q) => n + q.lotes.length, 0);
const nFavela = K.BEIRA.filter(l => l.favela).length;

const marcos = [];
for (const q of K.QUADRAS) {
  if (!q.equip) continue;
  for (const pc of q.equip.pecas) if (pc.k === 'modelo')
    marcos.push({ tipo: 'marco', pc, q, pol: retPts(pc.fatia), bb: { ...pc.fatia }, nome: NOME_MARCO[pc.modelo] || pc.modelo,
                  volumes: q.equip.tipo === 'marco' ? q.equip.volumes : volumesDaFatia(q.equip.volumes, pc.fatia) });
}
function volumesDaFatia(vs, f) { return (vs || []).filter(v => v.x0 >= f.x0 - 1 && v.x1 <= f.x1 + 1 && v.y0 >= f.y0 - 1 && v.y1 <= f.y1 + 1); }
if (K.ATACADEX) {
  const A = K.ATACADEX;
  marcos.push({ tipo: 'marco', atacadex: true, pc: A, pol: A.area, bb: bbox(A.area), nome: 'Atacadex', volumes: A.volumes });
}
const equipamentos = K.QUADRAS.filter(q => q.equip && q.equip.tipo !== 'marco').map(q => ({
  tipo: 'equip', q, pol: retPts(q.equip.area), bb: { ...q.equip.area },
  nome: q.equip.tipo === 'sede' ? 'Sede da ' + (q.equip.torcida && (q.equip.torcida.nome || q.equip.torcida.sigla) || 'torcida')
      : q.equip.tipo === 'bar' ? 'Bar da torcida' : NOME_EQUIP[q.equip.tipo] || q.equip.tipo
}));
const pecasSoltas = [];
for (const p of K.PROPS) pecasSoltas.push({ tipo: 'prop', k: p.k, v: p.v || 0, x: p.x, y: p.y, ang: p.ang, r: Math.max(6, p.r || 8), s: p.s || 1 });
for (const p of K.POSTES) pecasSoltas.push({ tipo: 'prop', k: 'poste', v: comTransformador(p.x, p.y) ? 1 : 0, x: p.x, y: p.y, ang: Math.atan2(p.dx, p.dz), r: 6, s: 1 });

/* o que a proposta cobre: o mato, a casa de beira e a moita que ficam
   debaixo das quadras novas saem do desenho e do clique */
const cobertoPelaProposta = (x, y, folga = RUA / 2) => PROP.quadras.some(q => x > q.x0 - folga && x < q.x1 + folga && y > q.y0 - folga && y < q.y1 + folga);
/* a casa de beira que fica na rua ou na quadra nova sai: a beira da estrada vira cidade */
for (const it of lotes) it.sobProposta = it.beira && !it.l.favela && cobertoPelaProposta((it.bb.x0 + it.bb.x1) / 2, (it.bb.y0 + it.bb.y1) / 2, RUA);
const lotesNovos = [];
for (const q of PROP.quadras) for (const l of q.lotes) { const pol = retPts(l); lotesNovos.push({ tipo: 'lote', l, pol, bb: { x0: l.x0, y0: l.y0, x1: l.x1, y1: l.y1 }, qn: q, proposta: true }); }

/* ======================================================
   O MAPA
   ====================================================== */
const cv = $('cv'), ctx = cv.getContext('2d');
const mapa = $('mapa');
const estado = {
  modo: 'atual', s: 0.1, ox: 0, oy: 0, larg: 1, alt: 1, dpr: 1,
  camadas: { rotulos: true, grade: true, arvores: true, props: true, carros: true },
  sel: null, sobre: null
};
const LIM_ATUAL = { x0: 120, y0: 150, x1: 4700, y1: 5420 };
const LIM_PROPOSTA = { x0: PROP.limite.x0 - 40, y0: PROP.limite.y0 - 40, x1: 4760, y1: 5420 };
const MUNDO = { x0: Math.min(K.VX0, PROP.limite.x0 - 200), y0: Math.min(K.VY0, PROP.limite.y0 - 120), x1: K.VX0 + K.VW, y1: K.VY0 + K.VH };

function enquadrar(r) {
  const s = Math.min(estado.larg / (r.x1 - r.x0), estado.alt / (r.y1 - r.y0)) * 0.96;
  estado.s = s;
  estado.ox = (r.x0 + r.x1) / 2 - estado.larg / 2 / s;
  estado.oy = (r.y0 + r.y1) / 2 - estado.alt / 2 / s;
}
const paraMundo = (sx, sy) => [estado.ox + sx / estado.s, estado.oy + sy / estado.s];
const paraTela = (x, y) => [(x - estado.ox) * estado.s, (y - estado.oy) * estado.s];

function tamanho() {
  const r = mapa.getBoundingClientRect();
  estado.dpr = Math.min(window.devicePixelRatio || 1, 2);
  estado.larg = Math.max(1, r.width); estado.alt = Math.max(1, r.height);
  cv.width = Math.round(estado.larg * estado.dpr); cv.height = Math.round(estado.alt * estado.dpr);
}

let pedido = 0;
function pedirDesenho() { if (!pedido) pedido = requestAnimationFrame(() => { pedido = 0; desenhar(); }); }

function caminho(pts, fechar = true) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (fechar) ctx.closePath();
}
const pol = (pts, cor) => { caminho(pts); ctx.fillStyle = cor; ctx.fill(); };
const ret = (r, cor) => { ctx.fillStyle = cor; ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0); };

function costa(dpx) {
  const pts = [];
  for (let ypx = -200; ypx <= 1200; ypx += 10) pts.push(K.pxm(K.xCosta(ypx) - dpx, ypx));
  return pts;
}
const fechado = (pts, xFim) => pts.concat([[xFim, pts[pts.length - 1][1]], [xFim, pts[0][1]]]);

function desenhar() {
  const { s, ox, oy, dpr } = estado;
  const vis = { x0: ox, y0: oy, x1: ox + estado.larg / s, y1: oy + estado.alt / s };
  const ve = b => b.x1 >= vis.x0 && b.x0 <= vis.x1 && b.y1 >= vis.y0 && b.y0 <= vis.y1;
  const px = v => v / s;                                    // v pixels de tela, em unidades de mundo
  const prop = estado.modo === 'proposta';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COR.mato; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, -dpr * s * ox, -dpr * s * oy);

  /* ---- o mato: trilha, moita, beco da favela ---- */
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = COR.trilha; ctx.lineWidth = 16;
  for (const t of K.TRILHAS) { caminho(t, false); ctx.stroke(); }
  for (const m of K.MOITAS) {
    if (m.x + m.r < vis.x0 || m.x - m.r > vis.x1 || m.y + m.r < vis.y0 || m.y - m.r > vis.y1) continue;
    if (prop && cobertoPelaProposta(m.x, m.y)) continue;
    ctx.fillStyle = COR.moita; ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r * 0.9, m.r * 0.7, 0, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = COR.beco; ctx.lineWidth = 44;
  for (const t of K.FAVELA_RUAS || []) { caminho(t, false); ctx.stroke(); }

  /* ---- os quarteirões: calçada, miolo, o chão do equipamento ---- */
  for (const q of K.CELULAS) {
    if (q.tipo !== 'quadra' || !ve(q)) continue;
    pol(q.pol, COR.calcada);
    if (q.polMiolo.length >= 3) {
      pol(q.polMiolo, COR.miolo);
      ctx.strokeStyle = '#000'; ctx.lineWidth = px(1); ctx.stroke();
    }
    if (q.equip) {
      ret(q.equip.area, q.equip.chao || '#9d9a90');
      for (const o of q.equip.pecas) if (o.k === 'piso') ret(o, o.cor);
    }
    for (const pr of q.pracinhas || []) {
      for (const t of pr.tiras) ret(t, COR.pracinha);
    }
    if (q.quintal) ret(q.quintal, COR.quintal);
    for (const f of q.fundos || []) ret(f, COR.fundos);
    const ss = q.semSaida;
    if (ss) {
      for (const r of ss.calcadas) ret(r, COR.calcada);
      for (const r of ss.asfalto) ret(r, COR.rua);
    }
  }
  /* ---- a calçada das avenidas (só dentro da cidade) ---- */
  ctx.save();
  caminho(K.CONTORNO.map(([a, b]) => K.pxm(a, b))); ctx.clip();
  ctx.strokeStyle = COR.calcada;
  for (const av of K.AVENIDAS) { ctx.lineWidth = av.l + 2 * CALC; caminho(av.pontos, false); ctx.stroke(); }
  ctx.restore();
  /* ---- as ruas da grade: só entre células urbanas ---- */
  const bx = K.bordasX, by = K.bordasY, nCol = bx.length / 2, nLin = by.length / 2;
  const celula = (i, j) => K.grade[i] && K.grade[i][j];
  const temRua = (...ij) => K.ruaEntre(ij.map(([i, j]) => celula(i, j)).filter(Boolean));
  ctx.fillStyle = COR.rua;
  for (let i = 0; i < nCol; i++) for (let j = 0; j < nLin; j++) {
    const x0 = bx[2 * i], x1 = bx[2 * i + 1], y0 = by[2 * j], y1 = by[2 * j + 1];
    const temCol = 2 * i + 2 < bx.length, temLin = 2 * j + 2 < by.length;
    if (temCol && temRua([i, j], [i + 1, j])) ctx.fillRect(x1, y0, bx[2 * i + 2] - x1, y1 - y0);
    if (temLin && temRua([i, j], [i, j + 1])) ctx.fillRect(x0, y1, x1 - x0, by[2 * j + 2] - y1);
    if (temCol && temLin && temRua([i, j], [i + 1, j], [i, j + 1], [i + 1, j + 1])) ctx.fillRect(x1, y1, bx[2 * i + 2] - x1, by[2 * j + 2] - y1);
  }
  /* ---- a orla: a avenida da beira, a praia e o mar ---- */
  const X1 = MUNDO.x1 + 200;
  pol(fechado(costa(K.PRAIA + K.ORLA), X1), COR.rua);
  pol(fechado(costa(K.PRAIA), X1), COR.areia);
  pol(fechado(costa(0), X1), COR.mar);
  /* ---- o campo de várzea ---- */
  for (const f of K.CAMPOS) {
    ret(f, COR.gramado);
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;
    ctx.strokeRect(f.x0 + 14, f.y0 + 14, f.x1 - f.x0 - 28, f.y1 - f.y0 - 28);
    ctx.beginPath(); ctx.moveTo((f.x0 + f.x1) / 2, f.y0 + 14); ctx.lineTo((f.x0 + f.x1) / 2, f.y1 - 14); ctx.stroke();
  }
  /* ---- o estádio ---- */
  ret({ x0: P.QEST_X0, y0: P.QEST_Y0, x1: P.QEST_X1, y1: P.QEST_Y1 }, COR.estadio);
  pol(P.anel(P.R.fachada1), COR.arquibancada);
  pol(P.anel(P.D.arq), '#b3ad9c');
  pol(P.anel(P.D.pista), COR.pista);
  pol(P.anel(0), COR.gramado);

  /* ---- a proposta: as ruas e as quadras novas por baixo das avenidas ---- */
  if (prop) desenharProposta(ve, px);

  /* ---- as avenidas por cima ---- */
  for (const av of K.AVENIDAS) {
    ctx.strokeStyle = COR.avenida; ctx.lineWidth = av.l; caminho(av.pontos, false); ctx.stroke();
    ctx.setLineDash([18, 14]); ctx.strokeStyle = COR.eixo; ctx.lineWidth = 1.6; caminho(av.pontos, false); ctx.stroke(); ctx.setLineDash([]);
  }

  /* ---- os equipamentos: as peças em planta ---- */
  for (const e of equipamentos) if (ve(e.bb)) desenharPecas(e.q.equip.pecas);
  for (const q of K.QUADRAS) for (const pr of q.pracinhas || []) desenharPecas(pr.pecas);
  /* ---- os marcos, o atacarejo e as torres: o chão da fatia e o volume ---- */
  for (const m of marcos) {
    if (!ve(m.bb)) continue;
    if (m.atacadex) pol(m.pc.area, COR.rua);
    for (const v of m.volumes || []) {
      if (v.base) continue;
      ret(v, v.alt > 400 ? '#9b8cc4' : COR.marco);
      ctx.strokeStyle = '#222'; ctx.lineWidth = px(1); ctx.strokeRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);
    }
  }
  /* ---- os lotes ---- */
  for (const it of lotes) {
    if (!ve(it.bb) || (prop && it.sobProposta)) continue;
    const l = it.l;
    pol(it.pol, l.favela ? (COR_FAVELA[l.tipo] || COR_FAVELA.casa) : (COR_LOTE[l.tipo] || '#f0f'));
    ctx.strokeStyle = '#222'; ctx.lineWidth = px(0.9); ctx.stroke();
  }
  if (prop) for (const it of lotesNovos) {
    if (!ve(it.bb)) continue;
    pol(it.pol, COR_LOTE[it.l.tipo] || '#f0f');
    ctx.strokeStyle = '#123a3d'; ctx.lineWidth = px(0.9); ctx.stroke();
  }
  /* ---- árvore, carro, poste e prop ---- */
  if (estado.camadas.arvores) {
    ctx.fillStyle = COR.arvore;
    for (const a of K.ARVORES) {
      if (a.x + a.r < vis.x0 || a.x - a.r > vis.x1 || a.y + a.r < vis.y0 || a.y - a.r > vis.y1) continue;
      if (prop && cobertoPelaProposta(a.x, a.y) && !dentroDaCidade(a.x, a.y)) continue;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.fill();
    }
  }
  if (estado.camadas.carros) {
    ctx.fillStyle = COR.carro;
    for (const c of K.CARROS) if (ve(c)) ctx.fillRect(c.x0, c.y0, c.x1 - c.x0, c.y1 - c.y0);
  }
  if (estado.camadas.props && s > 0.12) {
    for (const p of pecasSoltas) {
      if (p.x < vis.x0 - 20 || p.x > vis.x1 + 20 || p.y < vis.y0 - 20 || p.y > vis.y1 + 20) continue;
      if (p.k === 'poste') { ctx.fillStyle = COR.poste; ctx.fillRect(p.x - 4, p.y - 4, 8, 8); ctx.strokeStyle = '#333'; ctx.lineWidth = px(0.8); ctx.strokeRect(p.x - 4, p.y - 4, 8, 8); }
      else { ctx.fillStyle = COR_PROP[p.k] || '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(3.5, px(2.2)), 0, 7); ctx.fill(); }
    }
  }
  /* ---- a seleção e o que está debaixo do mouse ---- */
  for (const [it, cor, esp] of [[estado.sobre, '#ffffff', 2], [estado.sel, getComputedStyle(document.documentElement).getPropertyValue('--selecao').trim() || '#d4731c', 3.5]]) {
    if (!it) continue;
    if (it.tipo === 'prop') { ctx.strokeStyle = cor; ctx.lineWidth = px(esp); ctx.beginPath(); ctx.arc(it.x, it.y, Math.max(it.r, px(9)), 0, 7); ctx.stroke(); continue; }
    if (it.pol) { caminho(it.pol); ctx.strokeStyle = cor; ctx.lineWidth = px(esp); ctx.stroke(); }
  }

  /* ---- em tela: a grade com a régua de coordenadas e os rótulos ---- */
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (estado.camadas.grade) desenharGrade(vis);
  if (estado.camadas.rotulos) desenharRotulos(vis, prop);
  atualizarRegua();
}
const dentroDaCidade = (x, y) => { const q = K.celulaEm(x, y); return !!q && q.tipo === 'quadra'; };

function desenharProposta(ve, px) {
  const meia = RUA / 2;
  ctx.fillStyle = COR.rua;
  for (const q of PROP.quadras) ctx.fillRect(q.x0 - meia, q.y0 - meia, q.x1 - q.x0 + RUA, q.y1 - q.y0 + RUA);
  for (const q of PROP.quadras) {
    if (!ve(q)) continue;
    ret(q, COR.calcada);
    const miolo = { x0: q.ix0, y0: q.iy0, x1: q.ix1, y1: q.iy1 };
    if (q.equip) {
      ret(miolo, q.equip.cor);
      if (q.equip.tipo === 'campo') {
        ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
        ctx.strokeRect(miolo.x0 + 16, miolo.y0 + 16, miolo.x1 - miolo.x0 - 32, miolo.y1 - miolo.y0 - 32);
        ctx.beginPath(); ctx.moveTo((miolo.x0 + miolo.x1) / 2, miolo.y0 + 16); ctx.lineTo((miolo.x0 + miolo.x1) / 2, miolo.y1 - 16); ctx.stroke();
      }
    } else {
      ret(miolo, COR.miolo);
      if (q.quintal) ret(q.quintal, COR.quintal);
    }
  }
  ctx.setLineDash([px(7), px(5)]); ctx.strokeStyle = COR.nova; ctx.lineWidth = px(2.2);
  for (const q of PROP.quadras) if (ve(q)) ctx.strokeRect(q.x0, q.y0, q.x1 - q.x0, q.y1 - q.y0);
  ctx.setLineDash([]);
}

function desenharPecas(pecas) {
  for (const o of pecas) {
    switch (o.k) {
      case 'bloco': ret(o, o.cor || '#cfcac0'); ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.strokeRect(o.x0, o.y0, o.x1 - o.x0, o.y1 - o.y0); break;
      case 'muro': case 'guarita': case 'totem': case 'monumento': case 'canteiro': case 'bomba': ret(o, o.cor || '#b9b3a4'); break;
      case 'marquise': case 'claraboia': ctx.globalAlpha = 0.55; ret(o, o.cor || '#aaa'); ctx.globalAlpha = 1; break;
      case 'pilar': ctx.fillStyle = o.cor || '#b8b4a8'; ctx.fillRect(o.x - o.r, o.y - o.r, 2 * o.r, 2 * o.r); break;
      case 'coreto': ctx.fillStyle = '#b5543a'; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill(); break;
      case 'fonte': ctx.fillStyle = '#4d7f96'; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill(); break;
      case 'carro': if (estado.camadas.carros) ret(o, o.cor || COR.carro); break;
      case 'arvore': if (estado.camadas.arvores) { ctx.fillStyle = COR.arvore; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill(); } break;
      case 'poste': if (estado.camadas.props) { ctx.fillStyle = COR.poste; ctx.fillRect(o.x - 3, o.y - 3, 6, 6); } break;
      case 'banco': ret(o, '#8f5d33'); break;
      case 'mastro': ctx.fillStyle = '#eee'; ctx.fillRect(o.x - 3, o.y - 3, 6, 6); break;
    }
  }
}

function passoDaGrade() {
  for (const p of [25, 50, 100, 250, 500, 1000, 2000]) if (p * estado.s >= 55) return p;
  return 5000;
}
function desenharGrade(vis) {
  const passo = passoDaGrade(), s = estado.s;
  ctx.strokeStyle = 'rgba(255,255,255,.33)'; ctx.lineWidth = 0.7;
  ctx.fillStyle = 'rgba(20,22,21,.72)'; ctx.fillRect(0, 0, estado.larg, 18); ctx.fillRect(0, 0, 22, estado.alt);
  ctx.font = '10px "IBM Plex Mono", monospace'; ctx.fillStyle = '#eef0ec'; ctx.textBaseline = 'top';
  for (let x = Math.ceil(vis.x0 / passo) * passo; x < vis.x1; x += passo) {
    const [sx] = paraTela(x, 0);
    ctx.beginPath(); ctx.moveTo(sx, 18); ctx.lineTo(sx, estado.alt); ctx.stroke();
    ctx.fillText(String(x), sx + 2, 4);
  }
  ctx.save();
  for (let y = Math.ceil(vis.y0 / passo) * passo; y < vis.y1; y += passo) {
    const [, sy] = paraTela(0, y);
    ctx.beginPath(); ctx.moveTo(22, sy); ctx.lineTo(estado.larg, sy); ctx.stroke();
    ctx.save(); ctx.translate(4, sy - 2); ctx.rotate(-Math.PI / 2); ctx.fillText(String(y), 0, 0); ctx.restore();
  }
  ctx.restore();
}

function rotuloDoLote(l) {
  const pc = planoSeguro(l);
  const m = l.muro || (pc && pc.tipo && pc.tipo !== 'favela' ? pc.tipo.toUpperCase() : '');
  return (NOME_TIPO[l.tipo] || l.tipo).toLowerCase() + ' ' + (l.frente || '') + (m ? ' ' + m : '');
}
function desenharRotulos(vis, prop) {
  const s = estado.s;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (s >= 0.55) {
    ctx.font = '500 11px "Barlow Semi Condensed", "Arial Narrow", sans-serif'; ctx.fillStyle = '#000';
    const lista = prop ? lotes.filter(it => !it.sobProposta).concat(lotesNovos) : lotes;
    for (const it of lista) {
      const b = it.bb;
      if (b.x1 < vis.x0 || b.x0 > vis.x1 || b.y1 < vis.y0 || b.y0 > vis.y1) continue;
      if (Math.min(b.x1 - b.x0, b.y1 - b.y0) * s < 30) continue;
      const [sx, sy] = paraTela((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2);
      ctx.fillText(rotuloDoLote(it.l), sx, sy);
    }
  }
  /* os nomes grandes: equipamento, marco e quadra nova */
  ctx.font = '700 12px "Barlow Semi Condensed", "Arial Narrow", sans-serif';
  const ocupados = [];
  const etiqueta = (texto, x, y) => {
    const [sx, y0] = paraTela(x, y);
    if (sx < -80 || sx > estado.larg + 80 || y0 < -20 || y0 > estado.alt + 20) return;
    const w = ctx.measureText(texto).width + 10;
    const sy = [0, 20, -20, 40, -40].map(d => y0 + d).find(sy => !ocupados.some(o =>
      Math.abs(o.x - sx) < (o.w + w) / 2 + 2 && Math.abs(o.y - sy) < 19));
    if (sy === undefined) return;
    ocupados.push({ x: sx, y: sy, w });
    ctx.fillStyle = 'rgba(20,22,21,.78)'; ctx.fillRect(sx - w / 2, sy - 9, w, 18);
    ctx.fillStyle = '#f2f3ef'; ctx.fillText(texto, sx, sy + 0.5);
  };
  if (s >= 0.07) {
    for (const e of equipamentos) etiqueta(e.nome, (e.bb.x0 + e.bb.x1) / 2, (e.bb.y0 + e.bb.y1) / 2);
    for (const m of marcos) etiqueta(m.nome, (m.bb.x0 + m.bb.x1) / 2, (m.bb.y0 + m.bb.y1) / 2);
    etiqueta('ESTÁDIO', P.CX, P.CY);
    if (prop) for (const q of PROP.quadras) if (q.equip) etiqueta(q.equip.nome, (q.x0 + q.x1) / 2, (q.y0 + q.y1) / 2);
  }
  if (s < 0.55 && s >= 0.12) {
    ctx.font = '600 11px "IBM Plex Mono", monospace';
    for (const q of K.QUADRAS) {
      if (q.equip) continue;
      const [sx, sy] = paraTela(q.cx, q.cy);
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillText('Q ' + q.i + ',' + q.j, sx, sy);
    }
    if (prop) for (const q of PROP.quadras) {
      if (q.equip) continue;
      const [sx, sy] = paraTela((q.x0 + q.x1) / 2, (q.y0 + q.y1) / 2);
      ctx.fillStyle = '#0b4e53'; ctx.fillText('Q ' + q.i + ',' + q.j + (q.parte || ''), sx, sy);
    }
  }
}
function atualizarRegua() {
  const alvo = 110 / estado.s / M;
  const m = [1, 2, 5, 10, 20, 50, 100, 200, 500].find(v => v >= alvo * 0.6) || 500;
  $('regua').querySelector('b').style.width = Math.round(m * M * estado.s) + 'px';
  $('regua').querySelector('span').textContent = m + ' m  ·  1 m = ' + M.toFixed(1).replace('.', ',') + ' un';
}

/* ======================================================
   CLIQUE E ARRASTE
   ====================================================== */
function pegar(sx, sy) {
  const [x, y] = paraMundo(sx, sy);
  const prop = estado.modo === 'proposta';
  const naLista = lista => lista.find(it => x >= it.bb.x0 && x <= it.bb.x1 && y >= it.bb.y0 && y <= it.bb.y1 && dentro(x, y, it.pol));
  if (prop) { const n = naLista(lotesNovos); if (n) return n; }
  const l = naLista(lotes.filter(it => !(prop && it.sobProposta)));
  if (l) return l;
  if (estado.camadas.props && estado.s > 0.12) {
    let melhor = null, md = Math.max(8 / estado.s, 6);
    for (const p of pecasSoltas) { const d = Math.hypot(p.x - x, p.y - y); if (d < md) { md = d; melhor = p; } }
    if (melhor) return melhor;
  }
  const m = naLista(marcos);
  if (m) return m;
  if (prop) {
    const q = PROP.quadras.find(q => x >= q.x0 && x <= q.x1 && y >= q.y0 && y <= q.y1);
    if (q) return { tipo: 'quadraNova', q, pol: retPts(q), bb: { x0: q.x0, y0: q.y0, x1: q.x1, y1: q.y1 } };
  }
  const e = naLista(equipamentos);
  if (e) return e;
  const q = K.celulaEm(x, y);
  if (q && q.tipo === 'quadra') return { tipo: 'quadra', q, pol: q.pol, bb: { x0: q.x0, y0: q.y0, x1: q.x1, y1: q.y1 } };
  return null;
}

const ptrs = new Map();
let arrasto = null, pinca = null;
mapa.addEventListener('pointerdown', ev => {
  if (ev.target.closest('.zoom')) return;
  mapa.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId, { x: ev.offsetX, y: ev.offsetY });
  if (ptrs.size === 1) arrasto = { x: ev.offsetX, y: ev.offsetY, ox: estado.ox, oy: estado.oy, moveu: false };
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinca = { d: Math.hypot(a.x - b.x, a.y - b.y), s: estado.s, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    arrasto = null;
  }
});
mapa.addEventListener('pointermove', ev => {
  if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, { x: ev.offsetX, y: ev.offsetY });
  if (pinca && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    zoomEm(pinca.cx, pinca.cy, pinca.s * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, pinca.d), true);
    return;
  }
  if (arrasto) {
    const dx = ev.offsetX - arrasto.x, dy = ev.offsetY - arrasto.y;
    if (Math.hypot(dx, dy) > 4) { arrasto.moveu = true; mapa.classList.add('arrastando'); }
