<style>

}
:root[data-theme="dark"] {

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--papel); color: var(--tinta); font: 14px/1.45 var(--f-texto); }
.app {
  box-sizing: border-box; height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-inline: 16px; padding-block: 12px;
}
.topo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.nome h1 {
  margin: 0; font: 700 24px/1.05 var(--f-ui); letter-spacing: .01em; text-wrap: balance;
}

}
.legenda {

}
.legenda span { display: inline-flex; align-items: center; gap: 5px; }

.legenda i.barf { background: #8f8a7f; border: 2px solid #3d3a35; border-radius: 50%; }
.legenda i.sede { background: #1f5aa8; border: 2px solid #f2f1ec; }

.ficha .cores { display: inline-flex; gap: 3px; vertical-align: -1px; }
.ficha .escudos { display: flex; gap: 10px; align-items: center; margin: 2px 0 10px; }

.regua {

.coord {

.aviso {

.dica-hover {

.painel { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.vista3d {

.alterna3d {

  border-radius: 8px; border: 1px solid rgba(0,0,0,.35); background: rgba(246,247,243,.92); color: #1d2420;

.alterna3d input { accent-color: #0e7a82; margin: 0; }

.viagem3d { position: absolute; left: 8px; top: 8px; margin: 0; padding: 6px 10px; border-radius: 8px; background: #1f5aa8; color: #fff;

.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  border: 1px solid var(--linha); background: var(--papel); color: var(--tinta); }
.acoes button.principal { background: #1f5aa8; border-color: #1f5aa8; color: #fff; }
.ficha h3 { margin: 14px 0 6px; font: 700 15px/1.2 var(--f-ui); letter-spacing: .02em; }
.comodos { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; color: var(--tinta-2); }
.comodos b { color: var(--tinta); font: 700 13.5px/1.2 var(--f-ui); letter-spacing: .02em; }
.comodos span { font: 12px var(--f-dado); font-variant-numeric: tabular-nums; }
.carregando3d { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px var(--f-ui); color: var(--tinta-2); pointer-events: none; }
.ficha, .notas { background: var(--folha); border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px; }
.sobre { margin: 0 0 4px; font: 600 12px/1.3 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }

.ficha h2, .notas h2 { margin: 0 0 10px; font: 700 21px/1.15 var(--f-ui); text-wrap: balance; }
.dados { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.dados div { min-width: 0; }
.dados dt { font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.dados dd { margin: 2px 0 0; font: 13px/1.3 var(--f-dado); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.dados .largo { grid-column: 1 / -1; }
.nota { margin: 10px 0 0; color: var(--tinta-2); font-size: 13px; }
.campo { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.campo select { font: 500 15px/1.2 var(--f-texto); letter-spacing: 0; text-transform: none; color: var(--tinta); background: var(--papel);

.campo select:focus-visible { outline: 2px solid var(--selecao); outline-offset: 1px; }
.notas h3 { margin: 14px 0 6px; font: 700 15px/1.2 var(--f-ui); letter-spacing: .02em; }
.notas p, .notas li { font-size: 13.5px; }
.notas ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.numeros div { border-left: 3px solid var(--acento); padding: 2px 0 2px 8px; }
.numeros dt { font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.numeros dd { margin: 2px 0 0; font: 600 17px/1.15 var(--f-dado); font-variant-numeric: tabular-nums; white-space: nowrap; }
.numeros small { font: 12px var(--f-dado); color: var(--tinta-2); }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  .corpo { grid-template-columns: minmax(0, 1fr); }
  .mapa { height: 62vh; min-height: 320px; }
  .legenda { left: 10px; max-width: calc(100% - 20px); bottom: 44px; }
  .coord { left: 10px; top: 10px; }
  .zoom { top: 10px; }
  .painel { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  return new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = src; s.charset = 'utf-8'; s.onload = ok; s.onerror = () => erro(new Error(src));

  });
}
window.TO = window.TO || { dados: {} };
try {

  await carregarScript('dados/cidades.js');

} catch (e) {
  aviso.textContent = 'A planta da cidade não carregou (' + e.message + '). Recarregue a página.';
  throw e;
}

/* ======================================================
   O QUE SE CLICA
   ====================================================== */
const bbox = pts => {

  return { x0, y0, x1, y1 };

const retPts = r => [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]];
function dentro(x, y, pol) {
  let d = false;
  for (let i = 0, j = pol.length - 1; i < pol.length; j = i++) {
    const [xi, yi] = pol[i], [xj, yj] = pol[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) d = !d;
  }
  return d;
}
const quadraDe = new Map();
for (const q of K.QUADRAS) for (const l of q.lotes) quadraDe.set(l, q);

/* K.LOTES já traz a beira da estrada e a favela junto com os lotes de quadra */

const marcos = [];

                  volumes: q.equip.tipo === 'marco' ? q.equip.volumes : volumesDaFatia(q.equip.volumes, pc.fatia) });
}
function volumesDaFatia(vs, f) { return (vs || []).filter(v => v.x0 >= f.x0 - 1 && v.x1 <= f.x1 + 1 && v.y0 >= f.y0 - 1 && v.y1 <= f.y1 + 1); }

for (const p of K.PROPS) pecasSoltas.push({ tipo: 'prop', k: p.k, v: p.v || 0, x: p.x, y: p.y, ang: p.ang, r: Math.max(6, p.r || 8), s: p.s || 1 });

function eixosDoPortico(p) {

  const f = [-p.dir[0], -p.dir[1]], r = [f[1], -f[0]];
  return { f, r, noMundo: (lx, lz) => [p.x + (lx * r[0] + lz * f[0]) * M, p.y + (lx * r[1] + lz * f[1]) * M] };
}

/* ======================================================

   ====================================================== */
/* o lote de hoje que o mapa troca (a esquina que vira bar, o vizinho

let somemNaProposta = new Set(), bares = [], espacos = [];

/* as torcidas da cidade: a praça do jogo (`mapa` da torcida) é o nome

const slugDe = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, '-');

  const lista = [...(t.cores || []), t.detalhe].filter(Boolean).map(c => String(c).toUpperCase());
  const cor = lista[0] || '#8E3F9C', cor2 = lista.slice(1).find(c => c !== cor) || '#E8E2D0';
  const cor3 = lista.slice(1).find(c => c !== cor && c !== cor2) || null;

}

const NEUTRO = { cor: '#d6d1c4', cor2: '#c4beb0', cor3: '#8f8a7f' };

/* QUEM FICA COM O QUÊ (a regra é desta página; o jogo ainda não tem):
   - SEDE: a maior torcida (nível da sede, depois o poder) escolhe
     primeiro, e o espaço mais perto do estádio vai pra ela. A sede de
     nível 1 prefere o espaço pequeno (o da 5,2, onde só ela cabe); de
     nível 2 pra cima, o terreno inteiro. Nível 0 não tem sede.
   - BAR: toda sede já vem com um bar (GDD §8.1: a sede nível 1 ganha
     um bar nível 1), e é o bar livre mais perto da sede. Se a torcida

let ocupacao = { torcidas: [], semSede: [], mapa: '' };
/* O ESCUDO DE VERDADE: o mesmo PNG do jogo, pela mesma regra da planta
   (`caminhoDoEscudo` de dados/cena_estadio.js): dados/escudos.js é o
   manifesto do que existe em img/escudos/ (clube-<id>.png e
   torcida-<id>.png); sem o id lá, a sede fica com o escudo gerado. O
   caminho passa antes pelo `window.__EMBUTIDOS`, como o `IMG()` do jogo:
   aqui é onde moram os PNG embutidos. */
function caminhoDoEscudo(tipo, id) {
  const m = ((TO.dados && TO.dados.escudos) || {})[tipo === 'c' ? 'clubes' : 'torcidas'];
  if (!m || !id || !m[id]) return null;
  const caminho = 'img/escudos/' + (tipo === 'c' ? 'clube' : 'torcida') + '-' + id + '.png';
  return (window.__EMBUTIDOS && window.__EMBUTIDOS[caminho]) || caminho;
}
function distribuirTorcidas() {
  const mapa = slugDe(cidade);
  const ts = (TO.dados.torcidas || []).filter(t => t.mapa === mapa).map(t => {
    const c = coresDaTorcida(t), cl = (TO.dados.times || []).find(o => o.id === t.clubeId) || null;
    const cc = (cl && cl.cores || []).map(x => String(x).toUpperCase());
    return { t, id: t.id, clubeSigla: (cl && cl.sigla) || t.sigla || '', clubeCor: cc[0] || null, clubeCor2: cc.find(x => x !== cc[0]) || '#E8E2D0', sigla: String(t.siglaTorcida || t.nome).toUpperCase(), nome: t.nome, nomeCompleto: String(t.nome || t.siglaTorcida).toUpperCase(),

             escudo: caminhoDoEscudo('t', t.id), escudoClube: caminhoDoEscudo('c', t.clubeId),
             cor: c.cor, cor2: c.cor2, cor3: c.cor3 || c.cor2, nBares: Array.isArray(t.bares) ? t.bares.length : null, sede: null, bares: [] };
  }).sort((a, b) => b.nivel - a.nivel || b.poder - a.poder || a.sigla.localeCompare(b.sigla));
  for (const x of espacos) x.dono = null;
  for (const x of bares) x.dono = null;
  const doEstadio = x => Math.hypot((x.bb.x0 + x.bb.x1) / 2 - P.CX, (x.bb.y0 + x.bb.y1) / 2 - P.CY);
  const grandes = espacos.filter(x => x.e.cabe > 1).sort((a, b) => doEstadio(a) - doEstadio(b));
  const pequenos = espacos.filter(x => x.e.cabe === 1).sort((a, b) => doEstadio(a) - doEstadio(b));
  for (const T of ts) {
    if (T.nivel < 1) continue;
    const x = (T.nivel === 1 && pequenos.find(p => !p.dono)) || grandes.find(g => !g.dono);
    if (x) { x.dono = T; T.sede = x; }
  }
  for (const T of ts) {
    if (!T.sede) continue;
    const a = T.sede.bb, cx = (a.x0 + a.x1) / 2, cy = (a.y0 + a.y1) / 2;
    const livres = bares.filter(x => !x.dono).sort((p, q) => Math.hypot(p.b.x - cx, p.b.y - cy) - Math.hypot(q.b.x - cx, q.b.y - cy));

/* A SEDE NO ESPAÇO: o modelo novo da sede (js/sede3d.js), que refaz as
   paredes e as portas da sede da planta na fatia do espaço, virada pra
   frente dele, com a textura, a janela, o telhado e a mobília de cada
   cômodo. Torcida de nível 1 fica com o barracão; do nível 2 em diante,
   com a sede grande (como na planta). O espaço vago leva a sede do
   tamanho dele fechada: cor de reboco, nada dentro, porta abaixada. */

   como o areaDaSede da planta */

  if (frente === 'o') return { x0: a.x0, x1: a.x0 + PR, y0: a.y0, y1: a.y0 + LF };

  return { area, frente: e.frente, nivel: pequeno ? 1 : 3, lado: 'mandante', resto: area !== e.area ? e.area : null,
           torcida: T ? { cor: T.cor, cor2: T.cor2, cor3: T.cor3, sigla: T.sigla, nome: T.nomeCompleto,
                          clubeSigla: T.clubeSigla, clubeCor: T.clubeCor, clubeCor2: T.clubeCor2,

}
/* a sede de hoje (a da planta, com a torcida da partida que ela põe lá) */
function sedeDoEquip(eq) {

           torcida: T ? { cor: T.cor, cor2: T.cor2, cor3: T.cor3, sigla: T.rot || T.nome, nome: T.nomeCompleto || T.rot,
                          clubeSigla: T.clubeSigla, clubeCor: T.clubeCor, clubeCor2: T.clubeCor2,

/* a planta baixa sai do mesmo modelo, sem a geometria */
const plantaDaSede = sd => montarSede(sd, {}, { so2d: true });
for (const e of equipamentos) if (e.q.equip.tipo === 'sede') { e.sede = sedeDoEquip(e.q.equip); e.montagem = plantaDaSede(e.sede); }
/* O METRÔ: a entrada de cada estação é o que se clica no mapa. A planta
   baixa (a entrada na rua e o que fica embaixo) sai do próprio modelo. */
let porticos = [], METRO_P = null, estacoes = [];
/* os marcos de hoje que ficam no mapa da vez: o atacarejo sai quando o
   mapa o leva pra estrada norte (o pequeno o deixa onde está) */
const marcosDeHoje = () => PROP && PROP.atacadex ? marcos.filter(m => !m.atacadex) : marcos;
const outraDe = e => METRO_P.estacoes.find(o => o !== e);
const painelDe = e => 'partidas_' + outraDe(e).nome.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const opcEstacao = e => ({ outra: outraDe(e).nome, painel: painelDe(e) });
/* OS EQUIPAMENTOS NOVOS com modelo: o shopping, a delegacia e a Praça da
   Vila (a praça ocupa a quadra inteira, calçada junto; os prédios, o miolo) */
const MONTAR_EQUIP = { shopping: montarShopping, delegacia: montarDelegacia, praca: montarPraca };
const temModelo = q => !!q.equip && (q.equip.tipo === 'shopping' || q.equip.tipo === 'delegacia' || (q.equip.tipo === 'praca' && q.equip.nome === 'Praça da Vila'));

                            frente: q.equip.frente || 's', nome: q.equip.nome });
/* OS ESTÁDIOS: o de hoje é a primeira vaga; as cópias do mapa, as outras */
let estadios = [];
/* as quadras de hoje que o mapa refaz (a que a avenida tirada rasgava e

   estava no miolo delas; o que ficava na beira da avenida tirada também */
let trocadas = [];
const naTrocada = (x, y) => trocadas.some(q => x > q.x0 + CALC && x < q.x1 - CALC && y > q.y0 + CALC && y < q.y1 - CALC);

const nomeQuadraNova = q => q.rotulo || (q.i + ',' + q.j + (q.parte || ''));
/* o carro, o poste e o prop que ficam no atacarejo de hoje (quando ele

let carroSome = new Set();
function dentroDaCidadeHoje(x, y) { const q = K.celulaEm(x, y); return !!q && q.tipo === 'quadra'; }

/* ======================================================
   OS TRÊS MAPAS: o pequeno, o médio e o grande
   ====================================================== */
/* a praça escolhida decide o porte (o mapa), quantas vagas de estádio ela
   ocupa e se tem metrô; cada combinação sai do gerador uma vez só */
const infoDaCidade = nome => (TO.dados.cidades || []).find(c => c.id === slugDe(nome)) || null;
const mapaDoPorte = nome => { const c = infoDaCidade(nome); return (c && MAPA_DO_PORTE[c.tamanho]) || 'grande'; };

function propostaDe(modo) {
  const v = varianteDe(modo);
  if (!cacheDeMapas.has(v.chave)) cacheDeMapas.set(v.chave, gerarProposta(P, v.cfg, v.opc));
  return cacheDeMapas.get(v.chave);
}
/* o nome de cada vaga de estádio: os estádios da praça, na ordem de
   dados/cidades.js (o primeiro fica no estádio de hoje) */
function nomesDosEstadios() {
  const c = infoDaCidade(cidade), lista = (c && c.estadios) || [];

}
/* sem o dado, fica a praia do jogo */
const temPraia = () => { const c = infoDaCidade(cidade); return !c || !!c.temPraia; };
/* a praça de rio ou lagoa: a lagoa no lugar da praia e do mar */
const temLagoa = () => { const c = infoDaCidade(cidade); return !!(c && c.temLagoa); };
function montarDerivados() {
  cobertoPelaProposta = PROP.coberto;

  /* some no mapa o que fica debaixo de quadra nova, de favela nova ou do atacarejo novo */
  somePelaProposta = (x, y, folga = RUA / 2) => cobertoPelaProposta(x, y, folga) || PROP.naFavelaNova(x, y, 40) || PROP.noAtacadex(x, y, 40);
  for (const it of lotes) {
    const cx = (it.bb.x0 + it.bb.x1) / 2, cy = (it.bb.y0 + it.bb.y1) / 2;
    /* a favela de hoje sai (no mapa pequeno ela fica); a casa de beira que
       fica debaixo da grade nova, ou longe de toda estrada que sobrou, sai */
    it.sobProposta = false;

  }

  for (const q of PROP.quadras) for (const l of q.lotes) { const pol = retPts(l); lotesNovos.push({ tipo: 'lote', l, pol, bb: { x0: l.x0, y0: l.y0, x1: l.x1, y1: l.y1 }, qn: q, proposta: true }); }
  lotesFavelaNova = [];
  for (const f of PROP.favelas) for (const l of f.lotes) { const pol = K.cantosDoLote(l).slice(0, 4); lotesFavelaNova.push({ tipo: 'lote', l, pol, bb: bbox(pol), favelaNova: f, proposta: true }); }
  marcosNovos = [];
  for (const c of PROP.condominios) for (const pc of c.torres)
    marcosNovos.push({ tipo: 'marco', pc, pol: retPts(pc.fatia), bb: { ...pc.fatia }, nome: pc.nome, volumes: pc.volumes, proposta: true, condominio: c });
  if (PROP.atacadex) marcosNovos.push({ tipo: 'marco', atacadex: true, mudou: true, pc: PROP.atacadex.pc, pol: PROP.atacadex.area, bb: PROP.atacadex.bb,
                                        nome: 'Atacadex', volumes: PROP.atacadex.volumes, proposta: true });
  for (const it of lotes) if (PROP.lotesTirados.has(it.l)) it.sobProposta = true;
  for (const l of PROP.lotesExtra)
    lotesNovos.push({ tipo: 'lote', l, pol: retPts(l), bb: { x0: l.x0, y0: l.y0, x1: l.x1, y1: l.y1 }, proposta: true,
                      qh: K.QUADRAS.find(q => q.i === l.quadra.i && q.j === l.quadra.j) });
  somemNaProposta = new Set(PROP.baresHoje.concat(PROP.espacosSede.filter(e => e.hoje).map(e => e.quadra)));
  for (const e of equipamentos) e.somePelaProposta = somemNaProposta.has(e.q.i + ',' + e.q.j);
  bares = PROP.bares.map(b => ({ b, it: lotesNovos.find(it => it.l === b.lote) }));
  espacos = PROP.espacosSede.map(e => ({ tipo: 'espaco', e, pol: retPts(e.area), bb: { ...e.area }, nome: e.nome, proposta: true }));
  porticos = PROP.porticos.map(p => { const pol = poligonoDoPortico(p, 3.2); return { tipo: 'portico', p, pol, bb: bbox(pol), nome: p.nome, proposta: true }; });
  METRO_P = PROP.metro;
  estacoes = METRO_P ? METRO_P.estacoes.map(e => ({ tipo: 'estacao', est: e, pol: retPts(e.entrada), bb: { ...e.entrada }, nome: e.completo, proposta: true,
                                                   planta: montarEstacao(e, {}, opcEstacao(e)) })) : [];
  for (const q of PROP.quadras) if (temModelo(q) && !q.plantaEquip) q.plantaEquip = MONTAR_EQUIP[q.equip.tipo](specDoEquip(q), {}).planta2d;
  estadios = [{ tipo: 'estadio', dx: 0, dy: 0, vaga: 1, pol: P.anel(P.R.fachada1) }]
    .concat(PROP.estadios.map(e => ({ tipo: 'estadio', dx: e.dx, dy: e.dy, vaga: e.vaga, copia: e, proposta: true,
                                       pol: P.anel(P.R.fachada1).map(([x, y]) => [x + e.dx, y + e.dy]) })));
  for (const e of estadios) e.bb = bbox(e.pol);
  trocadas = K.QUADRAS.filter(q => PROP.substitui.has(q.i + ',' + q.j));
  for (const it of lotes) if (it.q && PROP.substitui.has(it.q.i + ',' + it.q.j)) it.sobProposta = true;
  const moveu = !!PROP.atacadex;
  carroSome = new Set(K.CARROS.filter(c => { const x = (c.x0 + c.x1) / 2, y = (c.y0 + c.y1) / 2;
    return (moveu && noAtacadexDeHoje(x, y, 20)) || (somePelaProposta(x, y, 0) && !dentroDaCidadeHoje(x, y)) || naTrocada(x, y) || naAvenidaTirada(x, y); }));
  for (const p of pecasSoltas) p.somePelaProposta = (moveu && noAtacadexDeHoje(p.x, p.y, 20)) || (somePelaProposta(p.x, p.y, 0) && !dentroDaCidadeHoje(p.x, p.y))
    || naTrocada(p.x, p.y) || naAvenidaTirada(p.x, p.y);
  LIM_PROPOSTA = { x0: PROP.limite.x0 - 40, y0: PROP.limite.y0 - 40, x1: 5000, y1: Math.max(5980, PROP.limite.y1 + 80) };
  MUNDO = { x0: Math.min(K.VX0, PROP.mundo.x0), y0: Math.min(K.VY0, PROP.mundo.y0), x1: K.VX0 + K.VW, y1: Math.max(K.VY0 + K.VH, PROP.mundo.y1) };
}
/* troca o mapa (se a variante mudou) e põe as torcidas da praça nele; o
   nome dos estádios é da praça, então sai sempre de novo */
function usarMapa(modo) {
  const novo = propostaDe(modo);
  const mudou = novo !== PROP;
  if (mudou) { PROP = novo; montarDerivados(); }
  const nomes = nomesDosEstadios();
  for (const e of estadios) e.nome = nomes[e.vaga - 1];
  distribuirTorcidas();
  return mudou;
}

/* ======================================================
   O MAPA
   ====================================================== */
const cv = $('cv'), ctx = cv.getContext('2d');
const mapa = $('mapa');
const estado = {
  modo: 'atual', s: 0.1, ox: 0, oy: 0, larg: 1, alt: 1, dpr: 1,
  camadas: { rotulos: true, grade: true, arvores: true, props: true, carros: true },
  sel: null, sobre: null
};
const LIM_ATUAL = { x0: 120, y0: 150, x1: 4700, y1: 5420 };
let LIM_PROPOSTA = null, MUNDO = null;         // (do mapa da vez: montarDerivados)

function enquadrar(r) {
  const s = Math.min(estado.larg / (r.x1 - r.x0), estado.alt / (r.y1 - r.y0)) * 0.96;
  estado.s = s;
  estado.ox = (r.x0 + r.x1) / 2 - estado.larg / 2 / s;
  estado.oy = (r.y0 + r.y1) / 2 - estado.alt / 2 / s;
}
const paraMundo = (sx, sy) => [estado.ox + sx / estado.s, estado.oy + sy / estado.s];
const paraTela = (x, y) => [(x - estado.ox) * estado.s, (y - estado.oy) * estado.s];

function tamanho() {
  const r = mapa.getBoundingClientRect();
  estado.dpr = Math.min(window.devicePixelRatio || 1, 2);
  estado.larg = Math.max(1, r.width); estado.alt = Math.max(1, r.height);
  cv.width = Math.round(estado.larg * estado.dpr); cv.height = Math.round(estado.alt * estado.dpr);
}

let pedido = 0;
function pedirDesenho() { if (!pedido) pedido = requestAnimationFrame(() => { pedido = 0; desenhar(); }); }

function caminho(pts, fechar = true) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (fechar) ctx.closePath();
}
const pol = (pts, cor) => { caminho(pts); ctx.fillStyle = cor; ctx.fill(); };
const ret = (r, cor) => { ctx.fillStyle = cor; ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0); };

function costa(dpx, yMin = -Infinity, yMax = Infinity) {
  const pts = [];
  for (let ypx = -420; ypx <= 1260; ypx += 10) { const p = K.pxm(K.xCosta(ypx) - dpx, ypx); if (p[1] >= yMin && p[1] <= yMax) pts.push(p); }
  return pts;
}
const fechado = (pts, xFim) => pts.concat([[xFim, pts[pts.length - 1][1]], [xFim, pts[0][1]]]);

/* A LAGOA (Belém, Manaus, Porto Alegre): no lugar da praia e do mar, uma
   lagoa comprida ao longo da avenida da beira, com a outra margem à vista
   e as duas pontas arredondadas. A beira é de capim, com barro na linha
   d'água e junco; no raso, aguapé boiando; um trapiche de madeira com a
   canoa amarrada, no meio da cidade; uma ilhota; e a mata na margem de
   lá. É desenho fixo (seno e hash, sem sorteio): sai igual toda vez. */
let LAGOA = null;
function montarLagoa() {
  const u = K.pxm(1, 0)[0] - K.pxm(0, 0)[0], y00 = K.pxm(0, 0)[1];      // 1 px do mapa em unidades
  const xDaCosta = y => K.pxm(K.xCosta((y - y00) / u), 0)[0];
  const guia = y => xDaCosta(y) - K.PRAIA * u;                           // a guia leste da avenida da beira
  const onda = (y, a) => a[0] * Math.sin(y / 190 + a[1]) + a[2] * Math.sin(y / 61 + a[3]) + a[4] * Math.sin(y / 23 + a[5]);
  const perto = y => guia(y) + 130 + onda(y, [26, 0.3, 12, 1.7, 5, 0.4]);
  const longe = y => xDaCosta(y) + 1450 + 280 * Math.sin(y / 950 + 0.8) + 90 * Math.sin(y / 310 + 2.1) + onda(y, [30, 2.2, 14, 0.9, 6, 2.8]);
  const Y0 = -2350, Y1 = 6250, R = 900;                                  // as pontas
  const fecha = y => Math.min(1, Math.sqrt(Math.max(0, (y - Y0) / R)), Math.sqrt(Math.max(0, (Y1 - y) / R)));
  const h = (...n) => { let v = 2166136261; for (const x of n) v = Math.imul(v ^ Math.round(x * 7), 16777619); return ((v >>> 0) % 10000) / 10000; };
  const beira = y => { const a = perto(y), b = longe(y), m = (a + b) / 2, r = (b - a) / 2 * fecha(y); return [m - r, m + r]; };
  const oeste = [], leste = [];
  for (let y = Y0; y <= Y1; y += 20) { const [a, b] = beira(y); oeste.push([a, y]); leste.push([b, y]); }
  const agua = oeste.concat(leste.slice().reverse());
  /* o junco: tufos na linha d'água, dos dois lados */
  const juncos = [];
  for (const [lado, pts] of [[-1, oeste], [1, leste]])
    for (let k = 0; k < pts.length; k += 2) {
      if (h(k, lado, 1) < 0.25) continue;
      const [x, y] = pts[k];
      juncos.push({ x: x + lado * (4 + h(k, lado, 2) * 14), y: y + (h(k, lado, 3) - 0.5) * 20, l: 10 + h(k, lado, 4) * 9, a: h(k, lado, 5) * 6 });
    }
  /* o aguapé: manchas no raso do lado da cidade */
  const aguapes = [];
  for (let y = Y0 + 700, k = 0; y < Y1 - 600; y += 240 + h(k, 9) * 200, k++) {
    const [a, b] = beira(y), x = a + 50 + h(k, 10) * Math.min(220, (b - a) * 0.3);
    const folhas = [];
    const n = 5 + Math.floor(h(k, 11) * 6);
    for (let f = 0; f < n; f++) folhas.push([x + (h(k, f, 12) - 0.5) * 70, y + (h(k, f, 13) - 0.5) * 50, 8 + h(k, f, 14) * 9, h(k, f, 15) < 0.3]);
    aguapes.push(folhas);
  }
  /* o trapiche, no meio da cidade, e a canoa amarrada nele */
  const yT = 1520, xT = beira(yT)[0] - 60, compr = 330, larg = 34;
  const trapiche = { ponte: { x0: xT, x1: xT + compr, y0: yT - larg / 2, y1: yT + larg / 2 },
                     cabeca: { x0: xT + compr - larg, x1: xT + compr, y0: yT - 70, y1: yT + 70 },
                     canoa: { x: xT + compr - 110, y: yT + 52, rx: 44, ry: 12 } };
  /* a ilhota, no meio da lagoa */
  const yI = 3950, [ia, ib] = beira(yI), ilha = [];
  for (let k = 0; k < 36; k++) {
    const t = k / 36 * Math.PI * 2, r = 1 + 0.12 * Math.sin(3 * t + 1) + 0.07 * Math.sin(7 * t);
    ilha.push([(ia + ib) / 2 + Math.cos(t) * 230 * r, yI + Math.sin(t) * 120 * r]);
  }
  const arvoresIlha = [[-70, -20, 38], [30, 15, 44], [95, -30, 30], [-10, 45, 28]].map(([dx, dy, r]) => ({ x: (ia + ib) / 2 + dx, y: yI + dy, r }));
  /* a mata da margem de lá */
  const mata = [];
  for (let y = Y0 - 200, k = 0; y < Y1 + 250; y += 60, k++) {
    if (h(k, 20) < 0.3) continue;
    const [, b] = beira(Math.min(Y1 - 1, Math.max(Y0 + 1, y)));
    mata.push({ x: Math.max(b, xDaCosta(y) + 400) + 90 + h(k, 21) * 380, y: y + (h(k, 22) - 0.5) * 40, r: 22 + h(k, 23) * 30, tom: h(k, 24) < 0.5 });
  }
  return { agua, juncos, aguapes, trapiche, ilha, arvoresIlha, mata };
}
function desenharLagoa(px) {
  const L = LAGOA || (LAGOA = montarLagoa());
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  /* a margem de capim e o barro da linha d'água, por baixo da água */
  caminho(L.agua); ctx.strokeStyle = COR.margem; ctx.lineWidth = 190; ctx.stroke();
  ctx.strokeStyle = COR.barro; ctx.lineWidth = 44; ctx.stroke();
  ctx.fillStyle = COR.lagoa; ctx.fill();
  ctx.save(); ctx.clip(); ctx.strokeStyle = COR.raso; ctx.lineWidth = 70; ctx.stroke(); ctx.restore();
  /* a ilhota */
  caminho(L.ilha); ctx.strokeStyle = COR.barro; ctx.lineWidth = 26; ctx.stroke();
  ctx.fillStyle = COR.margem; ctx.fill();
  for (const a of L.arvoresIlha) { ctx.fillStyle = '#2e5b2a'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.fill(); }
  /* o aguapé: folha redonda verde, uma ou outra com a flor lilás */
  for (const folhas of L.aguapes) for (const [x, y, r, flor] of folhas) {
    ctx.fillStyle = '#5b8a3c'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = flor ? '#a98bd0' : '#86ad5c'; ctx.beginPath(); ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.35, 0, 7); ctx.fill();
  }
  /* o junco: um tufo de cinco folhas finas */
  ctx.strokeStyle = COR.junco; ctx.lineWidth = Math.max(2.2, px(1));
  ctx.beginPath();
  for (const j of L.juncos) for (let f = 0; f < 5; f++) {
    const t = j.a + f * 1.2566;
    ctx.moveTo(j.x, j.y); ctx.lineTo(j.x + Math.cos(t) * j.l, j.y + Math.sin(t) * j.l);
  }
  ctx.stroke();
  /* o trapiche: as tábuas, a borda e os pilares; e a canoa */
  const T = L.trapiche;
  for (const r of [T.ponte, T.cabeca]) { ret(r, '#9a7a52'); ctx.strokeStyle = '#5e4630'; ctx.lineWidth = 3; ctx.strokeRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0); }
  ctx.fillStyle = '#4a3726';
  for (let x = T.ponte.x0 + 40; x < T.ponte.x1 - 20; x += 50) for (const y of [T.ponte.y0, T.ponte.y1 - 7]) ctx.fillRect(x, y, 7, 7);
  const c = T.canoa;
  ctx.fillStyle = '#b04a32'; ctx.beginPath(); ctx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#6b4a30'; ctx.beginPath(); ctx.ellipse(c.x, c.y, c.rx * 0.78, c.ry * 0.55, 0, 0, 7); ctx.fill();
  /* a mata da margem de lá */
  for (const a of L.mata) { ctx.fillStyle = a.tom ? '#2f5e2b' : '#3a6b33'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.fill(); }
}

function desenhar() {
  const { s, ox, oy, dpr } = estado;
  const vis = { x0: ox, y0: oy, x1: ox + estado.larg / s, y1: oy + estado.alt / s };
  const ve = b => b.x1 >= vis.x0 && b.x0 <= vis.x1 && b.y1 >= vis.y0 && b.y0 <= vis.y1;
  const px = v => v / s;                                    // v pixels de tela, em unidades de mundo
  const prop = estado.modo !== 'atual';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COR.mato; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, -dpr * s * ox, -dpr * s * oy);

  /* ---- o mato: trilha, moita, beco da favela ---- */
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = COR.trilha; ctx.lineWidth = 16;
  for (const t of K.TRILHAS) { caminho(t, false); ctx.stroke(); }
  for (const m of K.MOITAS) {
    if (m.x + m.r < vis.x0 || m.x - m.r > vis.x1 || m.y + m.r < vis.y0 || m.y - m.r > vis.y1) continue;
    if (prop && somePelaProposta(m.x, m.y)) continue;
    ctx.fillStyle = COR.moita; ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r * 0.9, m.r * 0.7, 0, 0, 7); ctx.fill();
  }
  if (prop) for (const f of PROP.favelas) for (const m of f.moitas) {
    ctx.fillStyle = COR.moita; ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r * 0.9, m.r * 0.7, 0, 0, 7); ctx.fill();
  }
  /* os becos: os da favela de hoje, ou os das duas favelas da proposta
     (com a rua principal no vão por onde a avenida passava) */
  ctx.strokeStyle = COR.beco; ctx.lineWidth = 44;
  if (!prop || PROP.ficaFavelaDeHoje) for (const t of K.FAVELA_RUAS || []) { caminho(t, false); ctx.stroke(); }
  if (prop) for (const f of PROP.favelas) {
    for (const t of f.becos) { ctx.lineWidth = t.w || 44; caminho(t, false); ctx.stroke(); }
    ctx.lineWidth = 44;
    const c = f.campinho;
    if (c) {
      ret(c, '#b39463');
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2.4;
      ctx.strokeRect(c.x0 + 10, c.y0 + 10, c.x1 - c.x0 - 20, c.y1 - c.y0 - 20);
      ctx.beginPath(); ctx.moveTo((c.x0 + c.x1) / 2, c.y0 + 10); ctx.lineTo((c.x0 + c.x1) / 2, c.y1 - 10); ctx.stroke();
      ctx.strokeStyle = COR.beco; ctx.lineWidth = 44;
    }
  }

  /* ---- as ruas da cidade nova, na largura inteira: vêm antes das quadras
     de hoje e antes da favela, que encosta na guia ---- */
  if (prop) {
    /* a faixa de rua de cada quadra nova, na largura de verdade (a mesma
       que a favela não pisa) */
    ctx.fillStyle = COR.rua;
    for (const q of PROP.quadras) ctx.fillRect(q.rua.x0, q.rua.y0, q.rua.x1 - q.rua.x0, q.rua.y1 - q.rua.y0);
  }
  /* ---- os quarteirões: calçada, miolo, o chão do equipamento ---- */
  for (const q of K.CELULAS) {
    if (q.tipo !== 'quadra' || !ve(q)) continue;
    if (prop && PROP.substitui.has(q.i + ',' + q.j)) continue;
    pol(q.pol, COR.calcada);
    if (q.polMiolo.length >= 3) {
      pol(q.polMiolo, COR.miolo);
      ctx.strokeStyle = '#000'; ctx.lineWidth = px(1); ctx.stroke();
    }
    if (q.equip && q.equip.tipo !== 'sede' && !(prop && somemNaProposta.has(q.i + ',' + q.j))) {
      ret(q.equip.area, q.equip.chao || '#9d9a90');
      for (const o of q.equip.pecas) if (o.k === 'piso') ret(o, o.cor);
    }
    for (const pr of q.pracinhas || []) {
      for (const t of pr.tiras) ret(t, COR.pracinha);
    }
    if (q.quintal) ret(q.quintal, COR.quintal);
    for (const f of q.fundos || []) ret(f, COR.fundos);
    const ss = q.semSaida;
    if (ss) {
      for (const r of ss.calcadas) ret(r, COR.calcada);
      for (const r of ss.asfalto) ret(r, COR.rua);
    }
  }
  /* ---- a calçada das avenidas (só dentro da cidade, e da cidade nova) ---- */
  const avenidas = prop ? PROP.avenidas : K.AVENIDAS;
  ctx.save();
  caminho(K.CONTORNO.map(([a, b]) => K.pxm(a, b)));
  if (prop) for (const q of PROP.quadras) ctx.rect(q.x0 - RUA / 2, q.y0 - RUA / 2, q.x1 - q.x0 + RUA, q.y1 - q.y0 + RUA);
  ctx.clip();
  ctx.strokeStyle = COR.calcada;
  for (const av of avenidas) { ctx.lineWidth = av.l + 2 * CALC; caminho(av.pontos, false); ctx.stroke(); }
  ctx.restore();
  /* ---- as ruas da grade: só entre células urbanas ---- */
  const bx = K.bordasX, by = K.bordasY, nCol = bx.length / 2, nLin = by.length / 2;
  const celula = (i, j) => K.grade[i] && K.grade[i][j];
  const temRua = (...ij) => K.ruaEntre(ij.map(([i, j]) => celula(i, j)).filter(Boolean));
  ctx.fillStyle = COR.rua;
  for (let i = 0; i < nCol; i++) for (let j = 0; j < nLin; j++) {
    const x0 = bx[2 * i], x1 = bx[2 * i + 1], y0 = by[2 * j], y1 = by[2 * j + 1];
    const temCol = 2 * i + 2 < bx.length, temLin = 2 * j + 2 < by.length;
    if (temCol && temRua([i, j], [i + 1, j])) ctx.fillRect(x1, y0, bx[2 * i + 2] - x1, y1 - y0);
    if (temLin && temRua([i, j], [i, j + 1])) ctx.fillRect(x0, y1, x1 - x0, by[2 * j + 2] - y1);
    if (temCol && temLin && temRua([i, j], [i + 1, j], [i, j + 1], [i + 1, j + 1])) ctx.fillRect(x1, y1, bx[2 * i + 2] - x1, by[2 * j + 2] - y1);
  }
  /* ---- a orla: a avenida da beira, a praia e o mar. A praça que não é
     do litoral não tem praia: depois da avenida da beira é mato; a de rio
     ou lagoa tem a lagoa ---- */
  const X1 = MUNDO.x1 + 200;
  if (prop && temLagoa()) desenharLagoa(px);
  else if (!prop || temPraia()) {
    /* no mapa a orla acaba onde a beira-mar acaba */
    const bm = prop && PROP.avenidas.find(a => a.id === 'beiramar');
    const orla = bm ? costa(K.PRAIA + K.ORLA, bm.pontos[0][1], bm.pontos[bm.pontos.length - 1][1]) : costa(K.PRAIA + K.ORLA);
    if (orla.length > 1) pol(fechado(orla, X1), COR.rua);
    pol(fechado(costa(K.PRAIA), X1), COR.areia);
    pol(fechado(costa(0), X1), COR.mar);
  }
  /* ---- o campo de várzea ---- */
  for (const f of K.CAMPOS) {
    ret(f, COR.gramado);
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;
    ctx.strokeRect(f.x0 + 14, f.y0 + 14, f.x1 - f.x0 - 28, f.y1 - f.y0 - 28);
    ctx.beginPath(); ctx.moveTo((f.x0 + f.x1) / 2, f.y0 + 14); ctx.lineTo((f.x0 + f.x1) / 2, f.y1 - 14); ctx.stroke();
  }
  /* ---- o estádio ---- */
  desenharEstadio(0, 0);

function textura(folha) {

  g.setAttribute('uv', new THREE.Float32BufferAttribute(juntarBlocos(blocos, 'uv'), 2));
