<title>Planta da Cidade do Estádio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

}
@media (prefers-color-scheme: dark) {

    --papel: #121615; --folha: #1a1f1e; --tinta: #e2e7e3; --tinta-2: #9ba59f; --linha: #2d3534;
    --acento: #45b6be; --acento-fundo: rgba(69, 182, 190, .16); --selecao: #f09c45;
    --ceu3d: #1d2529; --chao3d: #3b3e39;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #121615; --folha: #1a1f1e; --tinta: #e2e7e3; --tinta-2: #9ba59f; --linha: #2d3534;
  --acento: #45b6be; --acento-fundo: rgba(69, 182, 190, .16); --selecao: #f09c45;
  --ceu3d: #1d2529; --chao3d: #3b3e39;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--papel); color: var(--tinta); font: 14px/1.45 var(--f-texto); }
.app {
  box-sizing: border-box; height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-inline: 16px; padding-block: 12px;
}
.topo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.nome h1 {
  margin: 0; font: 700 24px/1.05 var(--f-ui); letter-spacing: .01em; text-wrap: balance;
}
.resumo { margin: 3px 0 0; font: 12px/1.3 var(--f-dado); color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.controles { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.modos { display: inline-flex; border: 1px solid var(--linha); border-radius: 8px; padding: 2px; background: var(--folha); }
.modos button {

  border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer;
}
.modos button[aria-selected="true"] { background: var(--tinta); color: var(--papel); }

.camadas { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 13px/1 var(--f-ui); color: var(--tinta-2); }

.corpo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; }
.mapa {

.zoom { position: absolute; right: 10px; top: 30px; display: flex; flex-direction: column; gap: 4px; }

}
.legenda {
  position: absolute; left: 30px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: calc(100% - 200px);
  padding: 6px 9px; border-radius: 8px; background: rgba(24,27,26,.78); color: #eef0ec;
  font: 500 12px/1.2 var(--f-ui); letter-spacing: .02em; pointer-events: none;
}
.legenda span { display: inline-flex; align-items: center; gap: 5px; }
.legenda i { width: 11px; height: 11px; border: 1px solid #111; display: inline-block; }
.legenda i.nova { border: 2px dashed #45b6be; background: transparent; }
.legenda i.bar { background: #c8342b; border: 2px solid #f2f1ec; border-radius: 50%; }
.legenda i.barf { background: #8f8a7f; border: 2px solid #3d3a35; border-radius: 50%; }
.legenda i.sede { background: #1f5aa8; border: 2px solid #f2f1ec; }
.legenda i.sedev { background: #aaa598; border: 2px dashed #57544d; }
.legenda i.metro { background: #1f5aa8; border: 2px solid #f2f1ec; border-radius: 50%; }
.torcidas { width: 100%; border-collapse: collapse; margin: 6px 0 0; font: 13px/1.3 var(--f-texto); }
.torcidas th { text-align: left; font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); padding: 0 6px 4px 0; }
.torcidas td { padding: 4px 6px 4px 0; border-top: 1px solid var(--linha); vertical-align: top; font-variant-numeric: tabular-nums; }
.torcidas tr.aqui td { font-weight: 700; color: var(--acento); }
.torcidas .cores { display: inline-flex; gap: 2px; vertical-align: -1px; margin-right: 5px; }
.torcidas .cores i, .ficha .cores i { width: 10px; height: 10px; display: inline-block; border: 1px solid rgba(0,0,0,.45); }
.ficha .cores { display: inline-flex; gap: 3px; vertical-align: -1px; }
.ficha .escudos { display: flex; gap: 10px; align-items: center; margin: 2px 0 10px; }
.ficha .escudos img { width: 48px; height: 48px; object-fit: contain; }
.ficha .escudos span { font: 12px/1.3 var(--f-texto); color: var(--tinta-2); }
.regua {
  position: absolute; right: 10px; bottom: 10px; padding: 5px 8px 6px; border-radius: 8px;
  background: rgba(24,27,26,.78); color: #eef0ec; font: 11px/1 var(--f-dado); pointer-events: none;
}
.regua b { display: block; height: 4px; margin-bottom: 4px; background: repeating-linear-gradient(90deg, #eef0ec 0 50%, #555 50% 100%); border: 1px solid #eef0ec; }
.coord {
  position: absolute; left: 30px; top: 30px; padding: 4px 8px; border-radius: 6px; background: rgba(24,27,26,.72);
  color: #eef0ec; font: 11px/1.2 var(--f-dado); pointer-events: none; font-variant-numeric: tabular-nums;
}
.aviso {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
  background: #555; color: #eef0ec; font: 600 16px/1.4 var(--f-ui); letter-spacing: .02em;
}
.dica-hover {
  position: absolute; pointer-events: none; padding: 4px 7px; border-radius: 6px; background: rgba(24,27,26,.88);
  color: #fff; font: 500 12px/1.25 var(--f-ui); white-space: nowrap; transform: translate(12px, 12px);
}

.painel { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.vista3d {
  position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--linha); background: var(--ceu3d);
  aspect-ratio: 4 / 3; max-width: 100%; flex: none;
}
.vista3d canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.dica { position: absolute; left: 8px; bottom: 6px; margin: 0; font: 500 11px/1 var(--f-ui); color: var(--tinta-2); pointer-events: none; }
.alterna3d {
  position: absolute; right: 8px; top: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 8px;
  border-radius: 8px; border: 1px solid rgba(0,0,0,.35); background: rgba(246,247,243,.92); color: #1d2420;
  font: 600 13px/1 var(--f-ui); letter-spacing: .02em; cursor: pointer;
}
.alterna3d input { accent-color: #0e7a82; margin: 0; }
.alterna3d:has(input:focus-visible) { outline: 2px solid var(--selecao); outline-offset: 2px; }
.viagem3d { position: absolute; left: 8px; top: 8px; margin: 0; padding: 6px 10px; border-radius: 8px; background: #1f5aa8; color: #fff;
  font: 600 13px/1.2 var(--f-ui); letter-spacing: .02em; pointer-events: none; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.acoes button { font: 600 14px/1 var(--f-ui); letter-spacing: .02em; padding: 9px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--linha); background: var(--papel); color: var(--tinta); }
.acoes button.principal { background: #1f5aa8; border-color: #1f5aa8; color: #fff; }
.ficha h3 { margin: 14px 0 6px; font: 700 15px/1.2 var(--f-ui); letter-spacing: .02em; }
.comodos { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; color: var(--tinta-2); }
.comodos b { color: var(--tinta); font: 700 13.5px/1.2 var(--f-ui); letter-spacing: .02em; }
.comodos span { font: 12px var(--f-dado); font-variant-numeric: tabular-nums; }
.carregando3d { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px var(--f-ui); color: var(--tinta-2); pointer-events: none; }
.ficha, .notas { background: var(--folha); border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px; }
.sobre { margin: 0 0 4px; font: 600 12px/1.3 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.sobre .chip { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: var(--acento); color: var(--folha); letter-spacing: .04em; }
.ficha h2, .notas h2 { margin: 0 0 10px; font: 700 21px/1.15 var(--f-ui); text-wrap: balance; }
.dados { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.dados div { min-width: 0; }
.dados dt { font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.dados dd { margin: 2px 0 0; font: 13px/1.3 var(--f-dado); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.dados .largo { grid-column: 1 / -1; }
.nota { margin: 10px 0 0; color: var(--tinta-2); font-size: 13px; }
.campo { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.campo select { font: 500 15px/1.2 var(--f-texto); letter-spacing: 0; text-transform: none; color: var(--tinta); background: var(--papel);
  border: 1px solid var(--linha); border-radius: 8px; padding: 7px 9px; }
.campo select:focus-visible { outline: 2px solid var(--selecao); outline-offset: 1px; }
.notas h3 { margin: 14px 0 6px; font: 700 15px/1.2 var(--f-ui); letter-spacing: .02em; }
.notas p, .notas li { font-size: 13.5px; }
.notas ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.numeros div { border-left: 3px solid var(--acento); padding: 2px 0 2px 8px; }
.numeros dt { font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.numeros dd { margin: 2px 0 0; font: 600 17px/1.15 var(--f-dado); font-variant-numeric: tabular-nums; white-space: nowrap; }
.numeros small { font: 12px var(--f-dado); color: var(--tinta-2); }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  .corpo { grid-template-columns: minmax(0, 1fr); }
  .mapa { height: 62vh; min-height: 320px; }
  .legenda { left: 10px; max-width: calc(100% - 20px); bottom: 44px; }
  .coord { left: 10px; top: 10px; }
  .zoom { top: 10px; }
  .painel { overflow: visible; }
}
.bt-modelos { font: 600 14px/1 var(--f-ui); letter-spacing: .02em; color: var(--tinta-2); background: var(--folha);
  border: 1px solid var(--linha); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.bt-modelos[aria-pressed="true"] { background: var(--acento); color: var(--folha); border-color: var(--acento); }
.bt-cenario { color: var(--folha); background: var(--acento); border-color: var(--acento); }
.catalogo { min-height: 0; overflow: auto; border-radius: 10px; border: 1px solid var(--linha); background: var(--folha); padding: 12px 14px; }
.catalogo h2 { margin: 2px 0 4px; font: 700 17px/1.2 var(--f-ui); }
.catalogo > p { margin: 0 0 6px; font: 13px/1.4 var(--f-texto); color: var(--tinta-2); }
.catalogo h3 { margin: 16px 0 6px; font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.catalogo ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.catalogo button { width: 100%; text-align: left; border: 1px solid var(--linha); background: var(--papel); border-radius: 8px;
  padding: 8px 10px; cursor: pointer; font: 600 14px/1.2 var(--f-ui); color: var(--tinta); }
.catalogo button small { display: block; margin-top: 3px; font: 400 12px/1.3 var(--f-texto); color: var(--tinta-2); }
.catalogo button[aria-pressed="true"] { border-color: var(--acento); box-shadow: inset 4px 0 0 var(--acento); }
.app.catalogo .mapa, .app.catalogo .notas { display: none; }
.app.catalogo .corpo { grid-template-columns: 320px minmax(0, 1fr); }
.app.catalogo .vista3d { aspect-ratio: auto; height: min(64vh, 660px); }
.ficha .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
.ficha .acoes button { font: 600 13px/1 var(--f-ui); border: 1px solid var(--linha); background: var(--papel); color: var(--tinta);
  border-radius: 7px; padding: 8px 11px; cursor: pointer; }
@media (max-width: 860px) {
  .app.catalogo .corpo { grid-template-columns: minmax(0, 1fr); }
  .app.catalogo .vista3d { height: 52vh; }
  .catalogo { max-height: 42vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="topo">
    <div class="nome">
      <h1>Planta da Cidade do Estádio</h1>
      <p class="resumo" id="resumo">carregando a planta…</p>
    </div>
    <div class="controles">
      <label class="cidade">Cidade <select id="sel-cidade"></select></label>
      <div class="modos" role="tablist" aria-label="Qual mapa">
        <button role="tab" id="aba-pequeno" aria-selected="false">Pequeno</button>
        <button role="tab" id="aba-medio" aria-selected="false">Médio</button>
        <button role="tab" id="aba-grande" aria-selected="true">Grande</button>
        <button role="tab" id="aba-atual" aria-selected="false">Jogo hoje</button>
      </div>
      <button class="bt-modelos" id="bt-modelos" aria-pressed="false">Modelos 3D</button>
      <button class="bt-modelos bt-cenario" id="bt-cenario" title="O mapa inteiro da praça em 3D">Cenário 3D</button>
      <div class="camadas">
        <label><input type="checkbox" id="c-rotulos" checked> Rótulos</label>
        <label><input type="checkbox" id="c-grade" checked> Grade</label>
        <label><input type="checkbox" id="c-arvores" checked> Árvores</label>
        <label><input type="checkbox" id="c-props" checked> Postes e props</label>
        <label><input type="checkbox" id="c-carros" checked> Carros</label>
      </div>
    </div>
  </header>
  <main class="corpo">
    <section class="mapa" id="mapa" aria-label="Mapa da cidade: arraste pra mover, role pra aproximar, clique num lote">
      <canvas id="cv"></canvas>
      <div class="zoom">
        <button id="z-mais" aria-label="Aproximar">+</button>
        <button id="z-menos" aria-label="Afastar">−</button>
        <button id="z-tudo" aria-label="Enquadrar a cidade">⤢</button>
      </div>
      <div class="coord" id="coord">x — · y —</div>
      <div class="legenda" id="legenda"></div>
      <div class="regua" id="regua"><b></b><span></span></div>
      <div class="dica-hover" id="hover" hidden></div>
      <div class="aviso" id="aviso">Montando a cidade…</div>
    </section>
    <section class="catalogo" id="catalogo" hidden aria-label="Os modelos 3D ainda fora do mapa"></section>
    <aside class="painel">
      <div class="vista3d" id="vista3d">
        <canvas id="c3d"></canvas>
        <label class="alterna3d" id="alterna-telhado" hidden><input type="checkbox" id="c-telhado"> Telhado</label>
        <p class="viagem3d" id="viagem3d" hidden></p>
        <div class="carregando3d" id="carregando3d" hidden>montando…</div>
        <p class="dica">Arraste pra girar · role pra aproximar · duplo clique centraliza</p>
      </div>
      <div class="ficha" id="ficha">
        <p class="sobre">Ficha</p>
        <h2>Clique num lote</h2>
        <p class="nota">Cada lote do mapa abre o imóvel em 3D, montado com o mesmo código do jogo.</p>
      </div>
      <div class="notas" id="notas" hidden></div>
    </aside>
  </main>
</div>

/* QUEM FICA COM O QUÊ (a regra é desta página; o jogo ainda não tem):
   - QUEM TEM SEDE: a maior torcida (nível da sede, depois o poder)
     entra primeiro. A sede de nível 1 cabe no espaço pequeno (o da 5,2,
     onde só ela cabe) ou num terreno inteiro; do nível 2 pra cima, só no
     terreno inteiro. Nível 0 não tem sede.

     rivais. A rivalidade é a dos dados, entre as torcidas da praça
     (`maioresRivais` pesa 3, `rivais` pesa 1; a do mesmo clube não conta),
     e de todas as distribuições possíveis sai a que deixa as rivais mais
     longe umas das outras (a soma das distâncias, com o peso). No empate
     (a praça sem rivalidade), a maior fica mais perto do estádio.
   - BAR: toda sede vem com um bar (GDD §8.1: a sede nível 1 ganha um bar
     nível 1), e ele não fica perto da sede da torcida (a BAR_LONGE_SEDE
     ou mais) nem da sede de uma rival (a BAR_LONGE_RIVAL ou mais) — o GDD
     §7.2 pede o bar noutra zona que a sede. As duas distâncias são as do
     mapa grande; no médio e no pequeno encolhem com o tamanho da cidade.
     Os bares saem todos de uma vez (`casar`): o máximo de torcidas com bar
     que serve e, entre essas, cada bar o mais perto da própria sede; quem
     fica sem bar que sirva leva o que chega mais perto da regra. Se a
     torcida tiver `bares` nos dados, ela fica com esse tanto.
   - SEDE E BAR JUNTOS: a sede manda. Das distribuições de sede quase tão
     boas quanto a melhor (a menor distância entre rivais a 90% ou mais
     da melhor), fica a primeira em que menos bar quebra a regra.
   - O que ninguém ocupa fica NEUTRO, de porta fechada. */
const BAR_LONGE_SEDE = 100, BAR_LONGE_RIVAL = 150;          // m, no mapa grande
/* o peso da rivalidade entre duas torcidas da praça (0: não são rivais) */
function pesoRival(A, B) {
  const a = A.t, b = B.t;
  if (a.clubeId && a.clubeId === b.clubeId) return 0;
  if ((a.maioresRivais || []).includes(b.id) || (b.maioresRivais || []).includes(a.id)) return 3;
  if ((a.rivais || []).includes(b.id) || (b.rivais || []).includes(a.id)) return 1;
  return 0;

const centroDe = x => [(x.bb.x0 + x.bb.x1) / 2, (x.bb.y0 + x.bb.y1) / 2];

  return Math.min(1, Math.hypot(L.x1 - L.x0, L.y1 - L.y0) / M / 675);

/* ONDE CADA SEDE FICA: as torcidas `S` (já na ordem de quem é maior)
   nos espaços. A nota de cada distribuição, nesta ordem: a menor
   distância entre duas sedes de maior rivalidade, a menor entre duas
   rivais quaisquer (ninguém em cima da rival: é o "lado oposto") e a
   soma das distâncias entre rivais, com o peso, menos um tico da
   distância da maior ao estádio (a praça sem rival fica com a regra
   antiga). São no máximo nove torcidas em nove espaços: a busca passa

function melhoresSedes(S, lista, quantas = 300) {
  const n = lista.length, k = S.length;

  const d = (i, j) => Math.hypot(c[i][0] - c[j][0], c[i][1] - c[j][1]);
  const est = c.map(([x, y]) => Math.hypot(x - P.CX, y - P.CY));
  const W = S.map(A => S.map(B => A === B ? 0 : pesoRival(A, B)));
  const cabe = S.map(T => lista.map(x => T.nivel === 1 || x.e.cabe > 1));
  const melhorQue = (a, b) => a.maior !== b.maior ? a.maior > b.maior : a.todas !== b.todas ? a.todas > b.todas : a.soma > b.soma + 1e-6;

  const buscar = (i, soma, maior, todas) => {
    if (i === k) {
      const nota = { soma, maior, todas };
      if (topo.length === quantas && !melhorQue(nota, topo[topo.length - 1])) return;
      let p = topo.length;
      while (p > 0 && melhorQue(nota, topo[p - 1])) p--;
      topo.splice(p, 0, { ...nota, atrib: atrib.slice() });
      if (topo.length > quantas) topo.pop();
      return;
    }
    for (let e = 0; e < n; e++) {
      if (usado[e] || !cabe[i][e]) continue;
      let ganho = -0.05 / (i + 1) * est[e], ma = maior, to = todas;
      for (let j = 0; j < i; j++) {
        const w = W[i][j];

        const dd = d(e, atrib[j]);

        if (dd < to) to = dd;
        if (w === 3 && dd < ma) ma = dd;

      /* a distância vai arredondada a 1 m, pra o empate valer entre as quase iguais */
      usado[e] = true; atrib[i] = e;
      buscar(i + 1, soma + ganho, Math.round(ma / M) * M, Math.round(to / M) * M);
      usado[e] = false;

/* CASAR cada linha com uma coluna pelo menor custo total (o método
   húngaro; as linhas não passam das colunas) */
function casar(custo) {
  const n = custo.length, m = custo[0].length, INF = 1e18;
  const u = new Array(n + 1).fill(0), v = new Array(m + 1).fill(0), p = new Array(m + 1).fill(0), via = new Array(m + 1).fill(0);
  for (let i = 1; i <= n; i++) {
    p[0] = i;
    let j0 = 0;
    const minv = new Array(m + 1).fill(INF), usada = new Array(m + 1).fill(false);
    do {
      usada[j0] = true;
      const i0 = p[j0];
      let delta = INF, j1 = 0;
      for (let j = 1; j <= m; j++) if (!usada[j]) {
        const cur = custo[i0 - 1][j - 1] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; via[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }
      for (let j = 0; j <= m; j++) if (usada[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta;
      j0 = j1;
    } while (p[j0] !== 0);
    do { const j1 = via[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
  }

  for (let j = 1; j <= m; j++) if (p[j]) res[p[j] - 1] = j - 1;
  return res;
}
/* OS BARES de uma distribuição de sede, todos de uma vez: o máximo de
   torcidas com bar que serve (longe da sede e das rivais) e, entre essas
   distribuições, o bar mais perto da própria sede; o que não serve paga
   pelo quanto falta. Devolve quantas torcidas ficaram com bar fora da regra */
function escolherBares(ts, lp, lr) {
  for (const x of bares) x.dono = null;
  for (const T of ts) T.bares = [];
  const dist = (x, [cx, cy]) => Math.hypot(x.b.x - cx, x.b.y - cy) / M;
  const linhas = [];
  for (const T of ts) if (T.sede) for (let q = 0; q < (T.nBares ?? 1); q++)
    linhas.push({ T, casa: centroDe(T.sede), rivais: ts.filter(U => U !== T && U.sede && pesoRival(T, U) > 0).map(U => centroDe(U.sede)) });

  if (!usadas.length) return 0;
  const falta = (q, b) => Math.max(0, 1 - dist(b, q.casa) / lp, ...q.rivais.map(r => 1 - dist(b, r) / lr));
  const custo = usadas.map(q => lista.map(b => { const f = falta(q, b); return (f > 0 ? 1e5 + 1e4 * f : 0) + dist(b, q.casa); }));
  let fora = 0;
  casar(custo).forEach((j, i) => {
    const q = usadas[i], x = lista[j];
    x.dono = q.T; q.T.bares.push(x);
    if (falta(q, x) > 0) fora++;

  LIM_PROPOSTA = { x0: PROP.limite.x0 - 40, y0: PROP.limite.y0 - 40, x1: 5000, y1: Math.max(5980, PROP.limite.y1 + 80) };
  MUNDO = { x0: Math.min(K.VX0, PROP.mundo.x0), y0: Math.min(K.VY0, PROP.mundo.y0), x1: K.VX0 + K.VW, y1: Math.max(K.VY0 + K.VH, PROP.mundo.y1) };
  montarCalcadas();
}

/* ======================================================
   AS CALÇADAS
   ------------------------------------------------------
   A calçada de cada quadra é o ANEL entre a guia (a borda da quadra) e
   a divisa dos lotes; a da BORDA DA CIDADE é a faixa do outro lado da
   rua que dá pro mato (pra ela também ter guia, poste e árvore); a
   avenida de entrada tem o CANTEIRO no meio. Tudo vira LAJE — em
   retângulos (o anel da quadra que a costa recorta, em polígono) — e o
   CONTORNO dela: a GUIA onde ela dá pra rua, a beira onde dá pro lote
   ou pro mato. Em cima, o MOBILIÁRIO: o poste de concreto (na guia que
   olha pro norte e pro oeste — um lado de cada rua —, na da costa e na
   calçada da borda), a árvore de calçada (na quadra nova e na borda: a
   quadra de hoje já tem as dela), o cesto de lixo na esquina, o
   hidrante e a placa da rua na quina. No chão, a FAIXA DE PEDESTRE
   rente à esquina, com o piso tátil amarelo nas duas pontas, e a BOCA
   DE LOBO logo depois dela, na sarjeta. No 3D a laje tem 7 cm (a do
   jogo), o meio-fio de concreto claro e a sarjeta, o piso de cimentado,
   de ladrilho hidráulico ou de bloquete (a quadra de hoje é mais de
   cimentado; a nova, de bloquete), a cova de terra da árvore; e o
   boneco sobe nela.
   ====================================================== */
const CALCADA_ALT = 1.4;                          // unidades: a laje acima da rua (a do jogo: 7 cm)
const GUIA = 0.13 * M, SARJETA = 0.32 * M;        // o topo do meio-fio e a sarjeta de concreto
const LADO_PEDACO = 1800;                         // a calçada em 3D sai em pedaços deste lado (93 m)
let CALCADAS = null;
const hashC = (...n) => {
  let h = 2166136261;
  for (const v of n) { h = Math.imul(h ^ Math.round(v * 7 + 3), 16777619); h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; }
  return (h >>> 0) / 4294967296;
};
/* um índice de retângulo por balde de 600 unidades (a pergunta "quem está
   aqui?" é feita dezenas de milhares de vezes) */
function IndiceRet(itens, caixaDe) {
  const T = 600, B = new Map();
  for (const it of itens) {
    const b = caixaDe(it);
    for (let i = Math.floor(b.x0 / T); i <= Math.floor(b.x1 / T); i++) for (let j = Math.floor(b.y0 / T); j <= Math.floor(b.y1 / T); j++) {
      const k = i * 100003 + j; let l = B.get(k); if (!l) B.set(k, l = []); l.push(it);
    }
  }
  return (x, y) => B.get(Math.floor(x / T) * 100003 + Math.floor(y / T)) || [];
}
/* o polígono é um retângulo em pé (quatro cantos, os lados em x e em y)? */
const ehRet = p => !!p && p.length === 4 && p.every((a, i) => { const b = p[(i + 1) % 4]; return Math.abs(a[0] - b[0]) < 1e-6 || Math.abs(a[1] - b[1]) < 1e-6; });
/* o retângulo `r` menos o `h`: até quatro pedaços */
function menosRet(r, h) {
  if (h.x0 >= r.x1 || h.x1 <= r.x0 || h.y0 >= r.y1 || h.y1 <= r.y0) return [r];
  const out = [], y0 = Math.max(r.y0, h.y0), y1 = Math.min(r.y1, h.y1);
  if (h.y0 > r.y0) out.push({ ...r, y1: h.y0 });
  if (h.y1 < r.y1) out.push({ ...r, y0: h.y1 });
  if (h.x0 > r.x0) out.push({ ...r, x1: h.x0, y0, y1 });
  if (h.x1 < r.x1) out.push({ ...r, x0: h.x1, y0, y1 });
  return out.filter(p => p.x1 - p.x0 > 0.5 && p.y1 - p.y0 > 0.5);
}
/* o piso e o tom de cada calçada (o tom multiplica a textura, que é clara) */
const PISOS_HOJE = [['cimentado', 0.7], ['ladrilho', 1]], PISOS_NOVA = [['bloquete', 0.5], ['ladrilho', 0.78], ['cimentado', 1]];
const TONS_PISO = { cimentado: ['#cdc8bc', '#c2bdb0', '#d5d0c5', '#bcb7ac'], ladrilho: ['#cf7d62', '#c2bdb2', '#d4aa6e', '#bd6c52'],
                    bloquete: ['#c0bcb2', '#bd7a60', '#aeaaa1', '#c98b6f'], grama: ['#ffffff'] };

function montarCalcadas() {
  const C = { rets: [], pols: [], bordas: [], cantos: [], faixas: [], moveis: [], zebras: [], bocas: [], covas: [], tateis: [], pedacos: [], alt: CALCADA_ALT };
  const noRet = (r, x, y, m = 0) => x > r.x0 - m && x < r.x1 + m && y > r.y0 - m && y < r.y1 + m;
  const E = PROP.entrada;
  /* AS QUADRAS COM CALÇADA: a de hoje que fica (a da beira da praia tem
     o contorno recortado pela costa) e a nova; a esplanada do estádio e
     a Praça da Vila (que toma a calçada) não */
  const lista = [];
  for (const q of K.QUADRAS) {
    if (PROP.substitui.has(q.i + ',' + q.j) || !q.pol || q.pol.length < 3) continue;
    const temMiolo = !!q.polMiolo && q.polMiolo.length >= 3;
    lista.push({ fora: q.pol, dentro: temMiolo ? q.polMiolo : null, r: bbox(q.pol), m: temMiolo ? bbox(q.polMiolo) : null, hoje: true, q,
                 cortada: !ehRet(q.pol) || (temMiolo && !ehRet(q.polMiolo)) });
  }
  for (const q of PROP.quadras) {
    if (q.estadio || (temModelo(q) && q.equip.tipo === 'praca')) continue;
    lista.push({ fora: retPts(q), r: { x0: q.x0, x1: q.x1, y0: q.y0, y1: q.y1 }, m: { x0: q.ix0, x1: q.ix1, y0: q.iy0, y1: q.iy1 }, hoje: false, q });
  }
  for (const Q of lista) {
    const h = hashC(Q.r.x0, Q.r.y0, 5), tab = Q.hoje ? PISOS_HOJE : PISOS_NOVA;
    Q.piso = tab.find(([, p]) => h < p)[0];
    const tons = TONS_PISO[Q.piso];
    Q.tom = tons[Math.floor(hashC(Q.r.x0, Q.r.y0, 6) * tons.length)];
  }
  /* QUEM OCUPA O CHÃO: a quadra (com calçada ou não), a célula de hoje que
     é quadra, campo ou estádio, a rua, a avenida, a favela, o Atacadex e
     a praia */
  const todas = PROP.quadras.map(q => ({ x0: q.x0, x1: q.x1, y0: q.y0, y1: q.y1 })).concat(lista.filter(Q => Q.hoje).map(Q => Q.r));
  const quadraEm = IndiceRet(todas, r => r);
  const ruaEm = IndiceRet(PROP.quadras.filter(q => q.rua), q => q.rua);
  const lotesFav = IndiceRet(lotesFavelaNova, it => ({ x0: it.bb.x0 - 12, x1: it.bb.x1 + 12, y0: it.bb.y0 - 12, y1: it.bb.y1 + 12 }));
  const celulaHoje = (x, y) => { const c = K.celulaEm(x, y); return !!c && (c.tipo === 'campo' || c.tipo === 'estadio' || (c.tipo === 'quadra' && !PROP.substitui.has(c.i + ',' + c.j))); };
  const emQuadra = (x, y) => quadraEm(x, y).some(r => noRet(r, x, y)) || celulaHoje(x, y);
  const ehAsfalto = (x, y) => !emQuadra(x, y) && (K.naRua(x, y) || PROP.naAvenida(x, y, 0) || ruaEm(x, y).some(q => noRet(q.rua, x, y)));
  const naFavela = (x, y) => PROP.naFavelaNova(x, y) || lotesFav(x, y).some(it => noRet({ x0: it.bb.x0 - 12, x1: it.bb.x1 + 12, y0: it.bb.y0 - 12, y1: it.bb.y1 + 12 }, x, y));
  const ocupado = (x, y) => { const z = K.zona(x, y); return z === 'mar' || z === 'praia' || z === 'orla' || emQuadra(x, y) || ehAsfalto(x, y) || naFavela(x, y) || PROP.noAtacadex(x, y, 30); };
  /* a largura da rua a partir de um ponto da guia, pra fora (0: não tem rua) */
  const larguraEm = (px, py, n) => {
    const asf = d => ehAsfalto(px + n[0] * d, py + n[1] * d);
    let w = 0;
    while (w < 420 && asf(w + 3)) w += 6;
    if (!w) return 0;
    let a = w - 3, b = w + 3;
    for (let k = 0; k < 7; k++) { const m = (a + b) / 2; if (asf(m)) a = m; else b = m; }
    return (a + b) / 2;
  };
  /* a de cada lado da quadra: a menor de três medidas ao longo dele (a do
     meio pode cair na boca de uma rua que chega do outro lado); na quadra
     da costa, o norte e o sul perto da ponta oeste, que é reta */
  const N = { n: [0, -1], s: [0, 1], o: [-1, 0], l: [1, 0] };
  const largura = (Q, lado) => {
    const r = Q.r, n = N[lado], ws = [];
    for (const t of Q.cortada && (lado === 'n' || lado === 's') ? [0.04, 0.1, 0.16] : [0.2, 0.5, 0.8]) {
      const px = lado === 'o' ? r.x0 : lado === 'l' ? r.x1 : r.x0 + (r.x1 - r.x0) * t;
      const py = lado === 'n' ? r.y0 : lado === 's' ? r.y1 : r.y0 + (r.y1 - r.y0) * t;
      const w = larguraEm(px, py, n);
      if (w) ws.push(w);
    }
    return ws.length ? Math.min(...ws) : 0;
  };
  for (const Q of lista) Q.w = { n: largura(Q, 'n'), s: largura(Q, 's'), o: largura(Q, 'o'), l: Q.cortada ? 0 : largura(Q, 'l') };

  /* A CALÇADA DA BORDA: do outro lado de cada rua, onde não tem quadra nem
     nada (é mato). A horizontal passa por cima das esquinas; a vertical
     vai só do fim de uma rua ao da outra, pra não empilhar na quina */
  const linhas = new Map();
  const refinar = (a, b, livre) => { for (let k = 0; k < 6; k++) { const m = (a + b) / 2; if (livre(m) === livre(a)) a = m; else b = m; } return (a + b) / 2; };
  const faixa = (chave, u0, u1, livre) => {
    let a = null;
    const passo = 10;
    for (let u = u0; u <= u1 + 1e-6; u += passo) {
      const ok = livre(u);
      if (ok && a === null) a = u === u0 ? u0 : refinar(u - passo, u, livre);
      if (a !== null && (!ok || u + passo > u1 + 1e-6)) {
        const b = ok ? u1 : refinar(u - passo, u, livre);
        if (b - a > 40) { let l = linhas.get(chave); if (!l) linhas.set(chave, l = []); l.push([a, b]); }
        a = null;
      }
    }
  };
  for (const Q of lista) {
    const r = Q.r, w = Q.w;
    for (const lado of ['n', 's']) {
      if (w[lado] < 30) continue;
      const yf = lado === 'n' ? r.y0 - w[lado] : r.y1 + w[lado], yc = lado === 'n' ? yf - CALC / 2 : yf + CALC / 2;
      faixa(lado + ':' + Math.round(yf), r.x0 - w.o - CALC, r.x1 + w.l + CALC, x => !ocupado(x, yc));
    }
    for (const lado of ['o', 'l']) {
      if (w[lado] < 30) continue;
      const xf = lado === 'o' ? r.x0 - w[lado] : r.x1 + w[lado], xc = lado === 'o' ? xf - CALC / 2 : xf + CALC / 2;
      faixa(lado + ':' + Math.round(xf), r.y0 - w.n, r.y1 + w.s, y => !ocupado(xc, y));
    }
  }
  for (const [chave, ints] of linhas) {
    const [lado, v] = chave.split(':'), c = +v;
    ints.sort((p, q) => p[0] - q[0]);
    const U = [];
    for (const [a, b] of ints) { if (U.length && a <= U[U.length - 1][1] + 1) U[U.length - 1][1] = Math.max(U[U.length - 1][1], b); else U.push([a, b]); }
    for (const [a, b] of U) C.faixas.push(lado === 'n' ? { x0: a, x1: b, y0: c - CALC, y1: c, guia: 's' } : lado === 's' ? { x0: a, x1: b, y0: c, y1: c + CALC, guia: 'n' }
                                        : lado === 'o' ? { x0: c - CALC, x1: c, y0: a, y1: b, guia: 'l' } : { x0: c, x1: c + CALC, y0: a, y1: b, guia: 'o' });
  }

  /* AS LAJES: o anel de cada quadra em quatro retângulos (menos o asfalto
     da rua sem saída, mais as calçadas dela), a faixa da borda e o
     canteiro; a quadra da costa, em polígono */
  const rets = C.rets;
  for (const Q of lista) {
    if (Q.cortada) { C.pols.push({ fora: Q.fora, dentro: Q.dentro, r: Q.r, piso: Q.piso, tom: Q.tom, tipo: 'anel', nova: !Q.hoje, larg: CALC }); continue; }
    const r = Q.r, m = Q.m;
    let pecas = m ? [{ x0: r.x0, x1: r.x1, y0: r.y0, y1: m.y0 }, { x0: r.x0, x1: r.x1, y0: m.y1, y1: r.y1 },
                     { x0: r.x0, x1: m.x0, y0: m.y0, y1: m.y1 }, { x0: m.x1, x1: r.x1, y0: m.y0, y1: m.y1 }] : [{ ...r }];
    const ss = Q.q && Q.q.semSaida;
    if (ss) { for (const h of ss.asfalto) pecas = pecas.flatMap(p => menosRet(p, h)); pecas = pecas.concat(ss.calcadas.map(c => ({ ...c, estreita: true }))); }
    for (const p of pecas) if (p.x1 - p.x0 > 0.5 && p.y1 - p.y0 > 0.5)
      rets.push({ x0: p.x0, x1: p.x1, y0: p.y0, y1: p.y1, tipo: 'anel', piso: Q.piso, tom: Q.tom, larg: p.estreita ? 30 : CALC, miolo: m, ss, nova: !Q.hoje });
  }
  for (const f of C.faixas) rets.push({ x0: f.x0, x1: f.x1, y0: f.y0, y1: f.y1, tipo: 'faixa', piso: 'cimentado', tom: TONS_PISO.cimentado[0], larg: CALC });
  const xc0 = E.x0 + E.pista, xc1 = xc0 + E.canteiro;
  for (const [a, b] of E.canteiros) if (b - a > 20) rets.push({ x0: xc0, x1: xc1, y0: a, y1: b, tipo: 'canteiro', piso: 'grama', tom: '#ffffff', larg: E.canteiro });

  /* O CONTORNO: de cada lado de cada retângulo, o pedaço que nenhum outro
     cobre do lado de fora; e cada pedaço, pelo que tem do lado de fora,
     é GUIA (a rua, a avenida, o asfalto da rua sem saída) ou beira */
  const idxRets = IndiceRet(rets, r => r);
  const ladoDeFora = (rt, x, y) => {
    if (rt.ss && rt.ss.asfalto.some(h => noRet(h, x, y))) return true;
    if (rt.miolo && noRet(rt.miolo, x, y)) return false;
    return ehAsfalto(x, y);
  };
  /* um pedaço de borda de A a B (n: a normal pra fora), partido onde o
     lado de fora muda */
  const partir = (A, B, n, cls, base) => {
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy);
    if (L < 0.5) return;
    const ux = dx / L, uy = dy / L, fora = t => cls(A[0] + ux * t + n[0] * 3, A[1] + uy * t + n[1] * 3);
    const emite = (t0, t1, g) => { if (t1 - t0 > 0.3) C.bordas.push({ ax: A[0] + ux * t0, ay: A[1] + uy * t0, bx: A[0] + ux * t1, by: A[1] + uy * t1, nx: n[0], ny: n[1], guia: g, ...base }); };
    const k1 = Math.max(1, Math.ceil(L / 12)), amostra = k => k === 0 ? Math.min(1, L / 2) : k === k1 ? Math.max(L - 1, L / 2) : k * L / k1;
    let a = 0, antes = amostra(0), ca = fora(antes);
    for (let k = 1; k <= k1; k++) {
      const s = amostra(k), c = fora(s);
      if (c !== ca) {
        let lo = antes, hi = s;
        for (let i = 0; i < 7; i++) { const m = (lo + hi) / 2; if (fora(m) === ca) lo = m; else hi = m; }
        const t = (lo + hi) / 2;
        emite(a, t, ca); a = t; ca = c;
      }
      antes = s;
    }
    emite(a, L, ca);
  };
  const D = 0.6;
  for (const rt of rets) {
    const base = { tipo: rt.tipo, larg: rt.larg, nova: !!rt.nova };
    for (const [a0, a1, fixo, nx, ny] of [[rt.x0, rt.x1, rt.y0, 0, -1], [rt.x0, rt.x1, rt.y1, 0, 1], [rt.y0, rt.y1, rt.x0, -1, 0], [rt.y0, rt.y1, rt.x1, 1, 0]]) {
      const hor = ny !== 0, fora = fixo + (hor ? ny : nx) * D, cands = new Set(), cobre = [];
      for (let u = a0; ; u += 500) { const uu = Math.min(u, a1); for (const s of idxRets(hor ? uu : fora, hor ? fora : uu)) cands.add(s); if (uu >= a1) break; }
      for (const s of cands) {
        if (s === rt || !(hor ? fora > s.y0 && fora < s.y1 : fora > s.x0 && fora < s.x1)) continue;
        const b0 = Math.max(a0, hor ? s.x0 : s.y0), b1 = Math.min(a1, hor ? s.x1 : s.y1);
        if (b1 > b0) cobre.push([b0, b1]);
      }
      cobre.sort((p, q) => p[0] - q[0]);
      let u = a0;
      const livre = (u0, u1) => { if (u1 - u0 > 0.5) partir(hor ? [u0, fixo] : [fixo, u0], hor ? [u1, fixo] : [fixo, u1], [nx, ny], (x, y) => ladoDeFora(rt, x, y), base); };
      for (const [b0, b1] of cobre) { if (b0 > u) livre(u, b0); u = Math.max(u, b1); }
      if (u < a1) livre(u, a1);
    }
  }
  /* o anel recortado: o contorno de fora (a normal pra fora dele) e o do
     miolo (a normal pra dentro do miolo, onde ficam os lotes) */
  const areaPol = p => { let a = 0; for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += (p[j][0] - p[i][0]) * (p[j][1] + p[i][1]); return a / 2; };
  for (const pl of C.pols) {
    const base = { tipo: 'anel', larg: CALC, nova: pl.nova };
    for (const [pts, praFora] of [[pl.fora, true], pl.dentro ? [pl.dentro, false] : null].filter(Boolean)) {
      const s = areaPol(pts) > 0 ? 1 : -1;
      for (let i = 0; i < pts.length; i++) {
        const A = pts[i], B = pts[(i + 1) % pts.length], L = Math.hypot(B[0] - A[0], B[1] - A[1]);
        if (L < 0.5) continue;
        /* a normal que sai do polígono (pela orientação dele) */
        let n = [(B[1] - A[1]) / L * s, -(B[0] - A[0]) / L * s];
        if (dentro(A[0] / 2 + B[0] / 2 + n[0] * 2, A[1] / 2 + B[1] / 2 + n[1] * 2, pts)) n = [-n[0], -n[1]];
        if (praFora) partir(A, B, n, (x, y) => ehAsfalto(x, y), base);
        else C.bordas.push({ ax: A[0], ay: A[1], bx: B[0], by: B[1], nx: -n[0], ny: -n[1], guia: false, ...base });
      }
    }
  }
  /* A QUINA DA SARJETA: onde duas guias se encontram em quina pra fora */
  const pontas = new Map(), chaveP = (x, y) => Math.round(x) + ',' + Math.round(y);
  for (const b of C.bordas) if (b.guia) for (const [x, y, ox, oy] of [[b.ax, b.ay, b.bx, b.by], [b.bx, b.by, b.ax, b.ay]]) {
    const k = chaveP(x, y); let l = pontas.get(k); if (!l) pontas.set(k, l = []); l.push({ b, x, y, ox, oy });
  }
  for (const l of pontas.values()) for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++) {
    const p = l[i], q = l[j], n1 = [p.b.nx, p.b.ny], n2 = [q.b.nx, q.b.ny];
    if (Math.abs(n1[0] * n2[0] + n1[1] * n2[1]) > 0.2) continue;
    if (n1[0] * (q.ox - p.x) + n1[1] * (q.oy - p.y) > 0.5 || n2[0] * (p.ox - q.x) + n2[1] * (p.oy - q.y) > 0.5) continue;
    C.cantos.push({ x: p.x, y: p.y, n1, n2 });
  }

  /* onde tem laje (pro poste de hoje, a árvore e o prop subirem nela) */
  const idxLaje = IndiceRet(rets.concat(C.pols.map(pl => ({ ...pl.r, pl }))), r => r);
  C.naLaje = (x, y) => idxLaje(x, y).some(r => r.pl ? dentro(x, y, r.pl.fora) && !(r.pl.dentro && dentro(x, y, r.pl.dentro)) : noRet(r, x, y));

  /* A GRADE DE PROTEÇÃO entre a cidade e o mato (a da foto do dono, a da
     Aerolândia): a tela verde de poste em poste em cima da mureta de
     concreto. Vai onde a cidade encosta no mato: atrás da calçada da
     borda (na beira dela, em cima da laje) e da quadra que dá direto pro
     mato; em volta da favela e do Atacadex; dos dois lados das avenidas
     onde elas correm no mato (a de entrada fora da cidade; a da beira,
     na praça sem praia), a meio metro do asfalto (no pórtico ela passa
     pelo pilar); e, no litoral, na beira da areia ao norte e ao sul da
     cidade. Com ela o boneco não passa pro mato (e o cenário ainda
     trava o mato inteiro: o que a grade não fecha, o mato fecha) */
  const ehMato = (x, y) => !ocupado(x, y) && !C.naLaje(x, y);
  /* na beira da areia a zona do jogo ainda diz "orla" (a calçada da
     avenida da beira, que ao norte e ao sul da cidade é mato pintado) */
  const ehMatoDaCosta = (x, y) => { const z = K.zona(x, y); return z !== 'mar' && z !== 'praia' && !emQuadra(x, y) && !ehAsfalto(x, y) && !naFavela(x, y) && !PROP.noAtacadex(x, y, 30) && !C.naLaje(x, y); };
  /* os trechos de A a B em que `ok(x, y)` vale: [t0, t1] em unidades */
  const trechos = (A, B, ok) => {
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), out = [];
    if (L < 1) return out;
    const f = t => ok(A[0] + dx / L * t, A[1] + dy / L * t);
    const k1 = Math.max(1, Math.ceil(L / 12)), amostra = k => k === 0 ? Math.min(0.5, L / 2) : k === k1 ? Math.max(L - 0.5, L / 2) : k * L / k1;
    let antes = amostra(0), ca = f(antes), a = 0;
    for (let k = 1; k <= k1; k++) {
      const sa = amostra(k), c = f(sa);
      if (c !== ca) {
        let lo = antes, hi = sa;
        for (let i = 0; i < 8; i++) { const m = (lo + hi) / 2; if (f(m) === ca) lo = m; else hi = m; }
        const t = (lo + hi) / 2;
        if (ca) out.push([a, t]);
        a = t; ca = c;
      }
      antes = sa;
    }
    if (ca) out.push([a, L]);
    return out.filter(([t0, t1]) => t1 - t0 > 0.8 * M);
  };
  /* a grade ao longo de A→B, deslocada `d` pra normal `n` (que aponta pro mato),
     nos trechos em que o ponto a `teste` dali (pro lado do mato) é mato */
  const cercar = (A, B, n, d, teste, y0, mato = ehMato) => {
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]);
    if (L < 1) return;
    const u = [(B[0] - A[0]) / L, (B[1] - A[1]) / L];
    for (const [t0, t1] of trechos(A, B, (x, y) => mato(x + n[0] * teste, y + n[1] * teste)))
      C.grades.push({ ax: A[0] + u[0] * t0 + n[0] * d, ay: A[1] + u[1] * t0 + n[1] * d, bx: A[0] + u[0] * t1 + n[0] * d, by: A[1] + u[1] * t1 + n[1] * d, nx: n[0], ny: n[1], y0 });
  };
  C.grades = [];
  for (const b of C.bordas) if (!b.guia && b.tipo !== 'canteiro') cercar([b.ax, b.ay], [b.bx, b.by], [b.nx, b.ny], -0.12 * M, 3, CALCADA_ALT);
  const normalPraFora = (pts, A, B) => {
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]);
    let n = [(B[1] - A[1]) / L, -(B[0] - A[0]) / L];
    if (dentro(A[0] / 2 + B[0] / 2 + n[0] * 2, A[1] / 2 + B[1] / 2 + n[1] * 2, pts)) n = [-n[0], -n[1]];
    return n;
  };
  const contornar = (pts, d) => { for (let i = 0; i < pts.length; i++) { const A = pts[i], B = pts[(i + 1) % pts.length];
    if (Math.hypot(B[0] - A[0], B[1] - A[1]) > 1) cercar(A, B, normalPraFora(pts, A, B), d, d + 0.6 * M, 0); } };
  for (const f of PROP.favelas) contornar(f.poly, 0.4 * M);
  if (PROP.atacadex) contornar(PROP.atacadex.area, 0.5 * M);
  const LADO_AV = 0.5 * M;
  for (const av of PROP.avenidas) {
    const pts = av.pontos;
    for (let i = 0; i + 1 < pts.length; i++) {
      const A = pts[i], B = pts[i + 1], L = Math.hypot(B[0] - A[0], B[1] - A[1]);
      if (L < 1) continue;
      const n = [(B[1] - A[1]) / L, -(B[0] - A[0]) / L], d = av.l / 2 + LADO_AV;
      for (const s of [1, -1]) { const m = [n[0] * s, n[1] * s]; cercar([A[0] + m[0] * d, A[1] + m[1] * d], [B[0] + m[0] * d, B[1] + m[1] * d], m, 0, 0.5 * M, 0); }
    }
  }
  if (temPraia() && !temLagoa()) {
    /* a beira da areia (do lado da terra), ao norte e ao sul da cidade */
    const pts = [], bm = PROP.avenidas.find(a => a.id === 'beiramar');
    const ya = bm ? bm.pontos[0][1] : Infinity, yb = bm ? bm.pontos[bm.pontos.length - 1][1] : -Infinity;
    for (let ypx = -4000; ypx <= 5000; ypx += 20) { const p = K.pxm(K.xCosta(ypx) - K.PRAIA, ypx); if (p[1] < ya || p[1] > yb) pts.push(p); else pts.push(null); }
    for (let i = 0; i + 1 < pts.length; i++) {
      if (!pts[i] || !pts[i + 1]) continue;
      const A = pts[i], B = pts[i + 1], L = Math.hypot(B[0] - A[0], B[1] - A[1]);
      let n = [(B[1] - A[1]) / L, -(B[0] - A[0]) / L];
      if (n[0] > 0) n = [-n[0], -n[1]];                      // pra terra (oeste)
      if (L > 1) cercar(A, B, n, 0.3 * M, 1.6 * M, 0, ehMatoDaCosta);
    }
  }

  /* O MOBILIÁRIO. Nada em cima do que já tem (o poste e o prop de hoje,
     o pórtico, a boca do metrô), nem a menos de 3 m de outra peça */
  const postos = [];
  for (const p of pecasSoltas) if (!p.somePelaProposta) postos.push([p.x, p.y, p.k === 'poste' ? 6 * M : 2.5 * M]);
  for (const it of porticos) postos.push([it.p.x, it.p.y, 12 * M]);
  const evitar = estacoes.map(it => ({ x0: it.bb.x0 - 3 * M, x1: it.bb.x1 + 3 * M, y0: it.bb.y0 - 3 * M, y1: it.bb.y1 + 3 * M }));
  const livreDePeca = (x, y, d) => !postos.some(([px, py, dp]) => Math.hypot(px - x, py - y) < Math.max(d, dp)) && !evitar.some(r => noRet(r, x, y));
  const por = (m, d) => { if (!livreDePeca(m.x, m.y, d)) return false; C.moveis.push(m); postos.push([m.x, m.y, d]); return true; };
  /* ao longo de uma guia: de `a` a `b`, com a normal pra dentro da

  const aoLongo = (a, b, n, larg, sem, oQue) => {
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (L < 6 * M) return;

    if (oQue.arvores) for (let t = 4 * M + hashC(sem, 2) * 6 * M, k = 0; t < L - 4 * M; t += (9 + hashC(sem, 3, k) * 6) * M, k++) {
      if (hashC(sem, 4, k) > oQue.arvores) continue;
      const p = ponto(t, larg * 0.62), rr = Math.min(larg * 0.62 - 1, 14 + hashC(sem, 5, k) * 16);
      if (por({ k: 'arvore', x: p.x, y: p.y, r: rr }, 3 * M)) C.covas.push({ x: p.x, y: p.y });
    }
    if (oQue.cesto && hashC(sem, 6) < oQue.cesto) { const p = ponto(2.6 * M, 0.35 * M); por({ k: 'cesto', v: Math.floor(hashC(sem, 7) * 5), x: p.x, y: p.y, ang }, 2.5 * M); }
    if (oQue.hidrante && hashC(sem, 8) < oQue.hidrante) { const p = ponto(L * (0.3 + hashC(sem, 9) * 0.4), 0.3 * M); por({ k: 'hidrante', x: p.x, y: p.y, ang }, 2.5 * M); }
  };
  /* a placa da rua, na quina noroeste de cada quadra (uma por cruzamento) */
  for (const Q of lista) {
    if (Q.cortada) continue;
    const r = Q.r, w = Q.w;
    if (w.n >= 30 && w.o >= 30 && hashC(r.x0, r.y0, 11) < 0.85) por({ k: 'placa', x: r.x0 + 0.3 * M, y: r.y0 + 0.3 * M, ang: Math.PI * 0.75 }, 2 * M);
  }
  for (const b of C.bordas) {
    if (!b.guia || b.tipo === 'canteiro' || b.larg < 40) continue;
    const diag = Math.abs(b.nx) > 0.2 && Math.abs(b.ny) > 0.2, praNorte = b.ny < -0.9, praOeste = b.nx < -0.9, faixa = b.tipo === 'faixa';
    aoLongo([b.ax, b.ay], [b.bx, b.by], [-b.nx, -b.ny], b.larg, b.ax * 3 + b.ay * 5 + b.nx * 7 + b.ny * 11,
            { postes: faixa || diag || praNorte || praOeste, arvores: faixa ? 0.4 : b.nova ? 0.55 : 0,
              cesto: faixa ? 0.2 : (praNorte || b.ny > 0.9) ? 0.35 : 0, hidrante: praNorte ? 0.3 : 0 });
  }
  /* O CANTEIRO: o poste no meio, de 30 em 30 m, com o braço pra uma pista
     e pra outra, e a árvore entre dois postes */
  const xm = (xc0 + xc1) / 2;
  for (const [a, b] of E.canteiros) {
    for (let y = a + 8 * M, k = 0; y < b - 8 * M; y += 30 * M, k++) por({ k: 'poste', v: 0, x: xm, y, ang: k % 2 ? Math.PI / 2 : -Math.PI / 2 }, 5 * M);
    for (let y = a + 23 * M; y < b - 6 * M; y += 30 * M) por({ k: 'arvore', x: xm, y, r: 15 + hashC(xm, y) * 4 }, 3 * M);
  }
  /* a árvore de hoje que fica na calçada ganha a cova */
  for (const a of K.ARVORES) if (!arvoreSai(a) && C.naLaje(a.x, a.y)) C.covas.push({ x: a.x, y: a.y });

  /* NO CHÃO: a faixa de pedestre rente à esquina (a listra corre no
     sentido da rua; na avenida, uma em cada pista, sem pintar o
     canteiro), o piso tátil nas duas pontas e a boca de lobo depois */
  const carros = K.CARROS.filter(c => !carroSome.has(c));
  const vistas = new Set();
  const canteiros = rets.filter(r => r.tipo === 'canteiro');
  const zebra = (x0, x1, y0, y1, dir) => {
    let pedacos = [{ x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0: Math.min(y0, y1), y1: Math.max(y0, y1) }];
    const k = [pedacos[0].x0, pedacos[0].x1, pedacos[0].y0, pedacos[0].y1].map(v => Math.round(v / 4)).join(',');
    if (vistas.has(k)) return false;
    vistas.add(k);
    for (const c of canteiros) pedacos = pedacos.flatMap(p => menosRet(p, { x0: c.x0 - SARJETA, x1: c.x1 + SARJETA, y0: c.y0 - SARJETA, y1: c.y1 + SARJETA }));
    if (pedacos.some(p => carros.some(c => c.x0 < p.x1 && c.x1 > p.x0 && c.y0 < p.y1 && c.y1 > p.y0))) return false;
    for (const p of pedacos) if ((dir === 'h' ? p.y1 - p.y0 : p.x1 - p.x0) > 2 * M) C.zebras.push({ ...p, dir });
    return true;
  };
  const tatil = (x0, x1, y0, y1) => { const r = { x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0: Math.min(y0, y1), y1: Math.max(y0, y1) };
    if (C.naLaje((r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2)) C.tateis.push(r); };
  for (const Q of lista) {
    if (Q.cortada) continue;
    const r = Q.r, w = Q.w, a = 0.6 * M, b = 3.6 * M, t0 = 0.22 * M, t1 = 0.62 * M;
    for (const [cx, cy, sx, sy] of [[r.x0, r.y0, 1, 1], [r.x1, r.y0, -1, 1], [r.x0, r.y1, 1, -1], [r.x1, r.y1, -1, -1]]) {
      /* a rua medida onde a faixa passa (no meio dela) */
      const wy = (sy > 0 ? w.n : w.s) >= 30 ? larguraEm(cx + sx * (a + b) / 2, cy, [0, -sy]) : 0;
      const wx = (sx > 0 ? w.o : w.l) >= 30 ? larguraEm(cx, cy + sy * (a + b) / 2, [-sx, 0]) : 0;
      /* a rua de cima/baixo (horizontal): a faixa atravessa ela, perto da quina */
      if (wy >= 30 && hashC(cx, cy, sy, 21) < 0.6 && zebra(cx + sx * a, cx + sx * b, cy, cy - sy * wy, 'h')) {
        const xa = cx + sx * ((a + b) / 2 - 0.75 * M), xb = cx + sx * ((a + b) / 2 + 0.75 * M);
        tatil(xa, xb, cy + sy * t0, cy + sy * t1); tatil(xa, xb, cy - sy * (wy + t0), cy - sy * (wy + t1));
        C.bocas.push({ x: cx + sx * (b + 1.1 * M), y: cy, nx: 0, ny: -sy });
      }
      if (wx >= 30 && hashC(cx, cy, sx, 22) < 0.6 && zebra(cx, cx - sx * wx, cy + sy * a, cy + sy * b, 'v')) {
        const ya = cy + sy * ((a + b) / 2 - 0.75 * M), yb = cy + sy * ((a + b) / 2 + 0.75 * M);
        tatil(cx + sx * t0, cx + sx * t1, ya, yb); tatil(cx - sx * (wx + t0), cx - sx * (wx + t1), ya, yb);
        C.bocas.push({ x: cx, y: cy + sy * (b + 1.1 * M), nx: -sx, ny: 0 });
      }
    }

  /* OS PEDAÇOS DO 3D: tudo cortado na grade de LADO_PEDACO (o forno junta
     por bloco, e a câmera descarta o bloco fora da vista) */
  const pedacos = new Map(), T = LADO_PEDACO;
  const pedaco = (x, y) => {
    const k = Math.floor(x / T) + ',' + Math.floor(y / T);
    let p = pedacos.get(k);
    if (!p) pedacos.set(k, p = { rets: [], pols: [], bordas: [], cantos: [], zebras: [], bocas: [], covas: [], tateis: [], grades: [] });
    return p;
  };
  for (const r of rets)
    for (let i = Math.floor(r.x0 / T); i * T < r.x1; i++) for (let j = Math.floor(r.y0 / T); j * T < r.y1; j++) {
      const x0 = Math.max(r.x0, i * T), x1 = Math.min(r.x1, (i + 1) * T), y0 = Math.max(r.y0, j * T), y1 = Math.min(r.y1, (j + 1) * T);
      if (x1 - x0 > 0.01 && y1 - y0 > 0.01) pedaco(x0 + 0.01, y0 + 0.01).rets.push({ x0, x1, y0, y1, piso: r.piso, tom: r.tom });
    }
  for (const pl of C.pols) pedaco((pl.r.x0 + pl.r.x1) / 2, (pl.r.y0 + pl.r.y1) / 2).pols.push(pl);
  for (const b of C.bordas) {
    const L = Math.hypot(b.bx - b.ax, b.by - b.ay), n = Math.max(1, Math.ceil(L / (T / 2)));
    for (let k = 0; k < n; k++) {
      const t0 = k / n, t1 = (k + 1) / n;
      const s = { ...b, ax: b.ax + (b.bx - b.ax) * t0, ay: b.ay + (b.by - b.ay) * t0, bx: b.ax + (b.bx - b.ax) * t1, by: b.ay + (b.by - b.ay) * t1 };
      pedaco((s.ax + s.bx) / 2, (s.ay + s.by) / 2).bordas.push(s);
    }
  }
  for (const c of C.cantos) pedaco(c.x, c.y).cantos.push(c);
  for (const z of C.zebras) pedaco((z.x0 + z.x1) / 2, (z.y0 + z.y1) / 2).zebras.push(z);
  for (const o of C.bocas) pedaco(o.x, o.y).bocas.push(o);
  for (const o of C.covas) pedaco(o.x, o.y).covas.push(o);
  for (const t of C.tateis) pedaco((t.x0 + t.x1) / 2, (t.y0 + t.y1) / 2).tateis.push(t);
  for (const gr of C.grades) {
    const L = Math.hypot(gr.bx - gr.ax, gr.by - gr.ay), n = Math.max(1, Math.ceil(L / (T / 2)));
    for (let k = 0; k < n; k++) {
      const t0 = k / n, t1 = (k + 1) / n;
      const s2 = { ...gr, ax: gr.ax + (gr.bx - gr.ax) * t0, ay: gr.ay + (gr.by - gr.ay) * t0, bx: gr.ax + (gr.bx - gr.ax) * t1, by: gr.ay + (gr.by - gr.ay) * t1 };
      pedaco((s2.ax + s2.bx) / 2, (s2.ay + s2.by) / 2).grades.push(s2);
    }
  }
  C.pedacos = [...pedacos.values()];

}
/* troca o mapa (se a variante mudou) e põe as torcidas da praça nele; o
   nome dos estádios é da praça, então sai sempre de novo */
function usarMapa(modo) {
  const novo = propostaDe(modo);
  const mudou = novo !== PROP;
  if (mudou) { PROP = novo; montarDerivados(); }
  const nomes = nomesDosEstadios();
  for (const e of estadios) e.nome = nomes[e.vaga - 1];
  distribuirTorcidas();
  return mudou;
}

/* ======================================================
   O MAPA
   ====================================================== */
let cv = $('cv'), ctx = cv.getContext('2d');
/* o que o desenho está pintando agora: nada (a tela), 'chao' ou 'mascara' (o cenário 3D, pintarChao) */
let pintandoChao = null;
const mapa = $('mapa');
const estado = {
  modo: 'atual', s: 0.1, ox: 0, oy: 0, larg: 1, alt: 1, dpr: 1,
  camadas: { rotulos: true, grade: true, arvores: true, props: true, carros: true },
  sel: null, sobre: null
};
const LIM_ATUAL = { x0: 120, y0: 150, x1: 4700, y1: 5420 };
let LIM_PROPOSTA = null, MUNDO = null;         // (do mapa da vez: montarDerivados)

function enquadrar(r) {
  const s = Math.min(estado.larg / (r.x1 - r.x0), estado.alt / (r.y1 - r.y0)) * 0.96;
  estado.s = s;
  estado.ox = (r.x0 + r.x1) / 2 - estado.larg / 2 / s;
  estado.oy = (r.y0 + r.y1) / 2 - estado.alt / 2 / s;
}
const paraMundo = (sx, sy) => [estado.ox + sx / estado.s, estado.oy + sy / estado.s];
const paraTela = (x, y) => [(x - estado.ox) * estado.s, (y - estado.oy) * estado.s];

function tamanho() {
  const r = mapa.getBoundingClientRect();
  estado.dpr = Math.min(window.devicePixelRatio || 1, 2);
  estado.larg = Math.max(1, r.width); estado.alt = Math.max(1, r.height);
  cv.width = Math.round(estado.larg * estado.dpr); cv.height = Math.round(estado.alt * estado.dpr);
}

let pedido = 0;
function pedirDesenho() { if (!pedido) pedido = requestAnimationFrame(() => { pedido = 0; desenhar(); }); }

function caminho(pts, fechar = true) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (fechar) ctx.closePath();
}
const pol = (pts, cor) => { caminho(pts); ctx.fillStyle = cor; ctx.fill(); };
const ret = (r, cor) => { ctx.fillStyle = cor; ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0); };

function costa(dpx, yMin = -Infinity, yMax = Infinity) {
  const pts = [];
  /* nos três mapas (e no chão do cenário) a costa passa da ponta do mapa
     (reta, como o xCosta segue pra lá das pontas): a areia e o mar vão
     até a borda, em faixa contínua; o "Jogo hoje" fica como o jogo é */
  const [ya, yb] = pintandoChao || estado.modo !== 'atual' ? [-4000, 5000] : [-420, 1260];
  for (let ypx = ya; ypx <= yb; ypx += 10) { const p = K.pxm(K.xCosta(ypx) - dpx, ypx); if (p[1] >= yMin && p[1] <= yMax) pts.push(p); }
  return pts;
}
const fechado = (pts, xFim) => pts.concat([[xFim, pts[pts.length - 1][1]], [xFim, pts[0][1]]]);

/* A LAGOA (Belém, Manaus, Porto Alegre): no lugar da praia e do mar, uma
   lagoa comprida ao longo da avenida da beira, com a outra margem à vista
   e as duas pontas arredondadas. A beira é de capim, com barro na linha
   d'água e junco; no raso, aguapé boiando; um trapiche de madeira com a
   canoa amarrada, no meio da cidade; uma ilhota; e a mata na margem de
   lá. É desenho fixo (seno e hash, sem sorteio): sai igual toda vez. */
/* A MATA: a copa das árvores vista de cima, num ladrilho de 2.400
   unidades (124 m) que se repete sem emenda — a copa que passa da borda
   dá a volta e aparece do outro lado. Cada copa tem a sombra pro sudeste
   e o brilho pro noroeste (o sol do mapa), e as de baixo cobrem as de
   cima. É desenho fixo (semente própria), feito uma vez. */
let PADRAO_MATA = null;
function padraoMata() {
  if (PADRAO_MATA) return PADRAO_MATA;
  const T = 1024, U = 2400, k = T / U;
  const cv2 = document.createElement('canvas'); cv2.width = cv2.height = T;
  const c = cv2.getContext('2d');
  c.fillStyle = '#2c4424'; c.fillRect(0, 0, T, T);
  let est = 71317;
  const rnd = () => {                                                    // mulberry32
    est = (est + 0x6D2B79F5) >>> 0; let t = est;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const TONS = [['#34522b', '#4d6f3b'], ['#3b5c2f', '#557a41'], ['#44672f', '#608a45'], ['#2f4b27', '#466838'],
                ['#4a6d35', '#6a9150'], ['#3a5a35', '#557a4c'], ['#526f2f', '#6f9044']];
  const copas = [];
  for (let n = 0; n < 1150; n++) {
    const r = (28 + rnd() * 46) * k;
    copas.push({ x: rnd() * T, y: rnd() * T, r, tom: TONS[Math.floor(rnd() * TONS.length)] });
  }
  copas.sort((a, b) => a.y - b.y);
  const copa = (x, y, r, [corpo, luz]) => {
    c.fillStyle = 'rgba(18,30,14,.55)'; c.beginPath(); c.arc(x + r * 0.22, y + r * 0.28, r, 0, 7); c.fill();
    c.fillStyle = corpo; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    c.fillStyle = luz; c.globalAlpha = 0.55; c.beginPath(); c.arc(x - r * 0.28, y - r * 0.3, r * 0.55, 0, 7); c.fill();
    c.globalAlpha = 1;
  };
  for (const p of copas)
    for (const dx of [-T, 0, T]) for (const dy of [-T, 0, T]) {
      const x = p.x + dx, y = p.y + dy;
      if (x + p.r * 1.3 < 0 || x - p.r > T || y + p.r * 1.3 < 0 || y - p.r > T) continue;
      copa(x, y, p.r, p.tom);
    }
  PADRAO_MATA = ctx.createPattern(cv2, 'repeat');
  PADRAO_MATA.setTransform(new DOMMatrix([1 / k, 0, 0, 1 / k, 0, 0]));
  return PADRAO_MATA;
}
/* O CERRADO: o capim amarelado, com mancha mais seca e mais verde, a terra
   vermelha aparecendo, o arbusto, a árvore baixa e torta bem espaçada (a
   copa de três ou quatro bolas, com a sombra) e o cupinzeiro. O mesmo
   ladrilho de 2.400 unidades da mata, sem emenda, com semente própria. */
let PADRAO_CERRADO = null;
function padraoCerrado() {
  if (PADRAO_CERRADO) return PADRAO_CERRADO;
  const T = 1024, U = 2400, k = T / U;
  const cv2 = document.createElement('canvas'); cv2.width = cv2.height = T;
  const c = cv2.getContext('2d');
  c.fillStyle = '#a39d5e'; c.fillRect(0, 0, T, T);
  let est = 50923;
  const rnd = () => {                                                    // mulberry32
    est = (est + 0x6D2B79F5) >>> 0; let t = est;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  /* desenha em volta do ladrilho também, pra ele emendar consigo mesmo */
  const volta = (x, y, r, f) => { for (const dx of [-T, 0, T]) for (const dy of [-T, 0, T]) {
    const X = x + dx, Y = y + dy; if (X + r < 0 || X - r > T || Y + r < 0 || Y - r > T) continue; f(X, Y); } };
  const bola = (x, y, rx, ry, cor, a = 1) => { c.globalAlpha = a; c.fillStyle = cor; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fill(); c.globalAlpha = 1; };
  /* a mancha de borda macia: o degradê some na beira, sem o risco do círculo */
  const mancha = (x, y, r, e, rgb, a) => {
    c.save(); c.translate(x, y); c.scale(1, e);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.6, `rgba(${rgb},${a * 0.7})`); g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.restore();
  };
  /* as manchas do capim: mais seco (dourado) e mais verde */
  for (let n = 0; n < 60; n++) {
    const x = rnd() * T, y = rnd() * T, r = (60 + rnd() * 170) * k, rgb = rnd() < 0.55 ? '184,172,102' : '138,145,86', a = 0.45 + rnd() * 0.3, e = 0.6 + rnd() * 0.4;
    volta(x, y, r, (X, Y) => mancha(X, Y, r, e, rgb, a));
  }
  /* a terra vermelha: três ou quatro manchas juntas, de beira macia */
  for (let n = 0; n < 16; n++) {
    const x = rnd() * T, y = rnd() * T, r = (18 + rnd() * 44) * k, partes = 3 + Math.floor(rnd() * 2);
    for (let i = 0; i < partes; i++) {
      const px2 = x + (rnd() - 0.5) * r * 1.4, py2 = y + (rnd() - 0.5) * r, rr = r * (0.55 + rnd() * 0.5), e = 0.55 + rnd() * 0.4;
      volta(px2, py2, rr, (X, Y) => mancha(X, Y, rr, e, '176,114,70', 0.75));
    }
  }
  /* o fiapo do capim */
  for (let n = 0; n < 2600; n++) {
    const x = rnd() * T, y = rnd() * T, cor = rnd() < 0.5 ? '#c2b673' : '#7f844c';
    c.fillStyle = cor; c.globalAlpha = 0.5; c.fillRect(x, y, 1.6, 1.6); c.globalAlpha = 1;
  }
  /* o cupinzeiro */
  for (let n = 0; n < 34; n++) {
    const x = rnd() * T, y = rnd() * T, r = (4 + rnd() * 3) * k;
    volta(x, y, r * 2, (X, Y) => { bola(X + r * 0.5, Y + r * 0.4, r, r, 'rgba(40,30,15,.35)'); bola(X, Y, r, r, '#8d5e3b'); bola(X - r * 0.3, Y - r * 0.3, r * 0.45, r * 0.45, '#b07a50'); });
  }
  /* o arbusto e a árvore: a sombra primeiro, a copa por cima, de cima pra baixo */
  const plantas = [];
  for (let n = 0; n < 300; n++) plantas.push({ x: rnd() * T, y: rnd() * T, r: (7 + rnd() * 9) * k, arv: false, tom: rnd() });
  for (let n = 0; n < 150; n++) plantas.push({ x: rnd() * T, y: rnd() * T, r: (18 + rnd() * 22) * k, arv: true, tom: rnd(), bolas: 3 + Math.floor(rnd() * 2), giro: rnd() * 6.28 });
  plantas.sort((a, b) => a.y - b.y);
  const TONS = ['#4e6a2e', '#5a7434', '#465f2a', '#617a3a'];
  for (const p of plantas) volta(p.x, p.y, p.r * 2, (X, Y) => {
    const cor = p.arv ? TONS[Math.floor(p.tom * TONS.length)] : (p.tom < 0.5 ? '#6f7d3a' : '#7c8742');
    const partes = p.arv ? Array.from({ length: p.bolas }, (_, i) => { const t = p.giro + i * 6.28 / p.bolas; return [X + Math.cos(t) * p.r * 0.45, Y + Math.sin(t) * p.r * 0.45, p.r * 0.62]; }) : [[X, Y, p.r]];
    for (const [x, y, r] of partes) bola(x + r * 0.35, y + r * 0.4, r, r * 0.9, 'rgba(45,40,15,.4)');
    for (const [x, y, r] of partes) bola(x, y, r, r, cor);
    if (p.arv) for (const [x, y, r] of partes) bola(x - r * 0.3, y - r * 0.3, r * 0.45, r * 0.45, '#7f9a4c', 0.55);
  });
  PADRAO_CERRADO = ctx.createPattern(cv2, 'repeat');
  PADRAO_CERRADO.setTransform(new DOMMatrix([1 / k, 0, 0, 1 / k, 0, 0]));
  return PADRAO_CERRADO;
}

/* A VEGETAÇÃO RASTEIRA, o chão do mato NO CENÁRIO 3D (o mapa 2D fica com
   a copa da mata e o capim do cerrado vistos de cima): o capim com o
   fiapo, as manchas de tom (mais seco, mais verde), a terra aparecendo em
   touceiras e a moita baixa com a sombra pro sudeste. Por vegetação: na
   MATA, o capim verde e a moita escura; no CERRADO, o capim dourado com
   a terra vermelha e o cupinzeiro; na CAATINGA, a terra clara e seca, o
   capim ralo e a moita cinza-esverdeada. Nada de ponto claro solto (o
   dono pediu pra tirar as bolinhas brancas do chão). As árvores de verdade
   (mato3d.js) vêm em cima, em 3D. O mesmo ladrilho de 2.400 unidades, sem
   emenda, feito uma vez por vegetação. */
const PADRAO_RASTEIRA = {};
const RASTEIRA = {
  mata:     { fundo: '#6c8744', tons: ['124,152,78', '96,124,62', '138,152,84', '112,142,70'], terra: '128,100,70', fiapo: ['#58763a', '#7f9d4f', '#8fa65a', '#4f6a33'],
              moita: ['#4a6a33', '#527238', '#5a7a3e'], luz: '#7a9a55', nMoita: 1500, nTerra: 14, cupim: 0 },
  cerrado:  { fundo: '#aa9c5d', tons: ['196,180,108', '150,148,84', '176,150,88', '134,140,80'], terra: '172,110,68', fiapo: ['#c0b06d', '#8e8a4e', '#a39457', '#7a7f47'],
              moita: ['#5d6d32', '#687a38', '#55662f'], luz: '#83964c', nMoita: 900, nTerra: 26, cupim: 30 },
  caatinga: { fundo: '#b3a07c', tons: ['196,178,140', '160,146,112', '176,168,130', '148,138,110'], terra: '204,180,138', fiapo: ['#a08e66', '#8b8466', '#c1ad84', '#7d7a60'],
              moita: ['#6f7a58', '#7c8664', '#646e50'], luz: '#8f9a74', nMoita: 760, nTerra: 34, cupim: 0 }
};
function padraoRasteira(veg) {
  const R = RASTEIRA[veg] || RASTEIRA.caatinga;
  if (PADRAO_RASTEIRA[veg]) return PADRAO_RASTEIRA[veg];
  const T = 1024, U = 2400, k = T / U, m = M * k;                          // m: pixels por metro
  const cv2 = document.createElement('canvas'); cv2.width = cv2.height = T;
  const c = cv2.getContext('2d');
  c.fillStyle = R.fundo; c.fillRect(0, 0, T, T);
  let est = { mata: 38113, cerrado: 52391, caatinga: 61027 }[veg] || 1;
  const rnd = () => {                                                    // mulberry32
    est = (est + 0x6D2B79F5) >>> 0; let t = est;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const volta = (x, y, r, f) => { for (const dx of [-T, 0, T]) for (const dy of [-T, 0, T]) {
    const X = x + dx, Y = y + dy; if (X + r < 0 || X - r > T || Y + r < 0 || Y - r > T) continue; f(X, Y); } };
  const mancha = (x, y, r, e, rgb, a) => {
    c.save(); c.translate(x, y); c.scale(1, e);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.55, `rgba(${rgb},${a * 0.75})`); g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.restore();
  };
  /* o tom do capim: manchas grandes, macias */
  for (let n = 0; n < 90; n++) {
    const x = rnd() * T, y = rnd() * T, r = (3 + rnd() * 12) * m, rgb = R.tons[Math.floor(rnd() * R.tons.length)], a = 0.3 + rnd() * 0.3, e = 0.55 + rnd() * 0.45;
    volta(x, y, r, (X, Y) => mancha(X, Y, r, e, rgb, a));
  }
  /* a terra aparecendo: três ou quatro manchas juntas, de beira macia */
  for (let n = 0; n < R.nTerra; n++) {
    const x = rnd() * T, y = rnd() * T, r = (1 + rnd() * 3.2) * m, partes = 3 + Math.floor(rnd() * 2);
    for (let i = 0; i < partes; i++) {
      const px2 = x + (rnd() - 0.5) * r * 1.5, py2 = y + (rnd() - 0.5) * r, rr = r * (0.5 + rnd() * 0.55), e = 0.5 + rnd() * 0.45;
      volta(px2, py2, rr, (X, Y) => mancha(X, Y, rr, e, R.terra, 0.8));
    }
  }
  /* o fiapo do capim: o risquinho de cada touceira */
  for (let n = 0; n < 16000; n++) {
    const x = rnd() * T, y = rnd() * T, a = -Math.PI / 2 + (rnd() - 0.5) * 1.8, l = (0.25 + rnd() * 0.35) * m;
    c.strokeStyle = R.fiapo[Math.floor(rnd() * R.fiapo.length)]; c.globalAlpha = 0.55; c.lineWidth = 1;
    volta(x, y, l, (X, Y) => { c.beginPath(); c.moveTo(X, Y); c.lineTo(X + Math.cos(a) * l, Y + Math.sin(a) * l); c.stroke(); });
  }
  c.globalAlpha = 1;
  /* o cupinzeiro (do cerrado) */
  for (let n = 0; n < R.cupim; n++) {
    const x = rnd() * T, y = rnd() * T, r = (0.35 + rnd() * 0.3) * m;
    volta(x, y, r * 2, (X, Y) => {
      c.fillStyle = 'rgba(40,30,15,.35)'; c.beginPath(); c.arc(X + r * 0.5, Y + r * 0.45, r, 0, 7); c.fill();
      c.fillStyle = '#8d5e3b'; c.beginPath(); c.arc(X, Y, r, 0, 7); c.fill();
    });
  }
  /* a moita baixa: a sombra pro sudeste, o corpo em duas ou três bolas e o
     lado do sol um pouco mais claro */
  const moitas = [];
  for (let n = 0; n < R.nMoita; n++) moitas.push({ x: rnd() * T, y: rnd() * T, r: (0.3 + rnd() * rnd() * 0.85) * m, tom: rnd(), n: 2 + Math.floor(rnd() * 2), giro: rnd() * 6.28 });
  moitas.sort((a, b) => a.y - b.y);
  for (const p of moitas) volta(p.x, p.y, p.r * 2.5, (X, Y) => {
    const partes = Array.from({ length: p.n }, (_, i) => { const t = p.giro + i * 6.28 / p.n; return [X + Math.cos(t) * p.r * 0.5, Y + Math.sin(t) * p.r * 0.4, p.r * (0.6 + 0.1 * i)]; });
    c.fillStyle = 'rgba(30,32,18,.24)';
    for (const [x, y, r] of partes) { c.beginPath(); c.ellipse(x + r * 0.45, y + r * 0.5, r, r * 0.85, 0, 0, 7); c.fill(); }
    c.fillStyle = R.moita[Math.floor(p.tom * R.moita.length)];
    for (const [x, y, r] of partes) { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
    c.fillStyle = R.luz; c.globalAlpha = 0.45;
    for (const [x, y, r] of partes) { c.beginPath(); c.arc(x - r * 0.3, y - r * 0.3, r * 0.5, 0, 7); c.fill(); }
    c.globalAlpha = 1;
  });
  const pd = ctx.createPattern(cv2, 'repeat');
  pd.setTransform(new DOMMatrix([1 / k, 0, 0, 1 / k, 0, 0]));
  return (PADRAO_RASTEIRA[veg] = pd);
}

/* A PRAIA (as praças do litoral, nos três mapas). Da avenida pro mar:
   - o calçadão de pedra portuguesa, com a onda preta e branca;
   - os coqueiros na beira do calçadão;
   - os quiosques, com o deck de madeira e as mesinhas de guarda-sol;
   - a areia: guarda-sol com a canga do lado, barraca, o posto de
     salva-vidas com a bandeira e a quadra de vôlei;
   - a areia molhada e a espuma na linha d'água;
   - o mar: o raso mais claro, as linhas de onda e os barcos (jangada de
     vela e barco de pesca com a esteira).
   O que é da praia de cidade (calçadão, coqueiro, quiosque, guarda-sol,
   barraca, posto, quadra) vai só onde a avenida da beira passa; a onda,
   a espuma e o raso vão na costa inteira. A FAIXA DE AREIA dos três
   mapas é a da planta (12,5 m) mais PRAIA_A_MAIS: a linha d'água vai pro
   mar (a cidade e a avenida ficam onde estão), e a areia fica com ~42 m;
   o "Jogo hoje" fica com a faixa do jogo. A posição de cada coisa é a
   distância pra linha d'água, na horizontal, como a própria faixa: o
   guarda-sol e a barraca espalhados em dois terços da areia, o posto a
   um quarto, a quadra no meio, o quiosque e o coqueiro na beira do
   calçadão. Desenho fixo (hash, sem sorteio), montado uma vez por trecho
   de avenida. */
const PRAIA_A_MAIS = 105;                 // px do desenho do jogo (45 px = 12,5 m)
const PRAIAS = new Map();
function montarPraia(ya, yb) {
  const u = K.pxm(1, 0)[0] - K.pxm(0, 0)[0], y00 = K.pxm(0, 0)[1];
  const xc = y => K.pxm(K.xCosta((y - y00) / u) + PRAIA_A_MAIS, 0)[0];  // a linha d'água
  const larg = (K.PRAIA + PRAIA_A_MAIS) * u;                             // a faixa de areia
  const rumo = y => Math.atan2(16, xc(y + 8) - xc(y - 8));               // o ângulo da costa (o x local corre ao longo dela)
  /* a onda, a espuma e o raso vão na costa inteira, pra lá das pontas do mapa */
  const Y0 = K.pxm(0, -4000)[1], Y1 = K.pxm(0, 5000)[1];
  ya = Math.max(Y0, ya); yb = Math.min(Y1, yb);
  const h = (...n) => { let v = 2166136261; for (const x of n) v = Math.imul(v ^ Math.round(x * 7 + 13), 16777619); v ^= v >>> 13; v = Math.imul(v, 2246822507); v ^= v >>> 16; return ((v >>> 0) % 100000) / 100000; };
  const linha = (d, y0 = Y0, y1 = Y1, passo = 16) => { const pts = []; for (let y = y0; y <= y1; y += passo) pts.push([xc(y) + d, y]); return pts; };
  /* as linhas de onda: pedaços de crista paralelos à praia, cada vez mais
     fracos pro fundo; e a espuma na linha d'água, contínua */
  const ondas = [];
  [[30, 8, 0.9], [82, 6, 0.72], [150, 5, 0.52], [245, 4, 0.36]].forEach(([d, w, a], n) => {
    for (let y = Y0 + h(n, 1) * 200, k = 0; y < Y1; k++) {
      const l = 140 + h(n, k, 2) * 260, pts = [];
      for (let t = 0; t <= l; t += 14) { const yy = Math.min(Y1, y + t); pts.push([xc(yy) + d + 7 * Math.sin(yy / 47 + n * 1.7 + k), yy]); }
      ondas.push({ pts, w, a });
      y += l + 50 + h(n, k, 3) * 190;
    }
  });
  const espuma = []; for (let y = Y0; y <= Y1; y += 12) espuma.push([xc(y) + 3 + 4 * Math.sin(y / 31) + 2 * Math.sin(y / 11 + 1), y]);
  /* o calçadão (a faixa de cima da areia) e a onda preta dele */
  const CALC_P = 40;
  const calcadao = ya < yb ? linha(-larg, ya, yb, 12).concat(linha(-larg + CALC_P, ya, yb, 12).reverse()) : [];
  const ondaCalcadao = []; for (let y = ya; y <= yb; y += 6) ondaCalcadao.push([xc(y) - larg + CALC_P / 2 + 11 * Math.sin(y / 23), y]);
  const lugar = (y, d) => ({ x: xc(y) - d, y, a: rumo(y) });
  /* os quiosques, a cada 1.000 a 1.400 unidades */
  const quiosques = [];
  for (let y = ya + 380, k = 0; y < yb - 300; y += 1000 + h(k, 10) * 400, k++) quiosques.push({ ...lugar(y, larg - CALC_P - 44), k });
  const longeDe = (lista, y, m) => lista.every(o => Math.abs(o.y - y) > m);
  /* o posto de salva-vidas e a quadra de vôlei, entre os quiosques */
  const postos = [];
  for (let y = ya + 900, k = 0; y < yb - 200; y += 1500 + h(k, 20) * 400, k++) {
    let yy = y; while (!longeDe(quiosques, yy, 170) && yy < yb - 200) yy += 60;
    if (yy < yb - 200) postos.push(lugar(yy, Math.max(78, larg * 0.26)));
  }
  const quadras = [];
  for (const f of [0.3, 0.68]) {
    let y = ya + (yb - ya) * f; while ((!longeDe(quiosques, y, 260) || !longeDe(postos, y, 170)) && y < yb - 300) y += 80;
    if (y < yb - 300 && yb - ya > 1500) quadras.push(lugar(y, Math.max(100, larg * 0.5)));
  }
  /* o guarda-sol, em grupinhos, fora do quiosque, da quadra e do posto */

/* ======================================================
   O 3D
   ====================================================== */
const texturas = {}, materiais = {};
THREE.DefaultLoadingManager.onLoad = () => vista && vista.pedir();
THREE.DefaultLoadingManager.onProgress = () => vista && vista.pedir();
function textura(folha) {
  if (!texturas[folha]) {
    const t = new THREE.TextureLoader().load(ATLAS[folha].arquivo);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    t.userData.src = ATLAS[folha].arquivo;          // (o forno do cenário junta pela folha)
    texturas[folha] = t;
  }
  return texturas[folha];
}
function material(folha) {
  if (materiais[folha]) return materiais[folha];
  /* o que fica embaixo da terra (o metrô) tem a face pra dentro do cômodo e
     só se desenha de frente: de cima, o teto e a parede do lado de cá somem */
  if (folha === 'metro_sub') materiais[folha] = new THREE.MeshLambertMaterial({ map: textura('metro'), vertexColors: true, side: THREE.FrontSide });
  else if (folha === 'vidros') materiais[folha] = new THREE.MeshLambertMaterial({ color: '#bcd6e0', transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false });
  /* a árvore low poly: só a cor de cada face, chapada, sem mapa */
  else if (folha === 'lowpoly') materiais[folha] = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide });
  /* a rede do vôlei: a folha das grades, mas transparente de verdade (e
     não recortada) — a malha fina, na média do mipmap, fica abaixo de
     qualquer limiar: recortada, ou some ou vira faixa preta; misturada,
     de longe ela é o véu escuro que a rede é */
  else if (folha === 'rede') materiais[folha] = new THREE.MeshLambertMaterial({
    map: textura('grades'), vertexColors: true, side: THREE.DoubleSide, transparent: true, depthWrite: false });
  else materiais[folha] = new THREE.MeshLambertMaterial({
    map: textura(folha), vertexColors: true, side: THREE.DoubleSide,
    alphaTest: folha === 'grades' ? 0.08 : 0, alphaToCoverage: folha === 'grades' });
  return materiais[folha];
}
function malhaDeBlocos(blocos, folha) {
  if (!blocos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(juntarBlocos(blocos, 'pos'), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(juntarBlocos(blocos, 'uv'), 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(juntarBlocos(blocos, 'cor'), 3));
  /* o bloco que traz a normal fica com ela; o resto, a da face */
  if (blocos.every(b => b.nor)) g.setAttribute('normal', new THREE.Float32BufferAttribute(juntarBlocos(blocos, 'nor'), 3));
  else g.computeVertexNormals();
  const m = new THREE.Mesh(g, material(folha));
  /* o que é recortado (a grade, a rede) faz a sombra recortada */
  if (folha === 'grades' || folha === 'rede')
    m.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: textura('grades'), alphaTest: 0.45 });
  /* o subsolo não pega a sombra da rua, e o vidro não faz sombra */
  m.castShadow = folha !== 'metro_sub' && folha !== 'vidros'; m.receiveShadow = folha !== 'vidros' && folha !== 'metro_sub';
  return m;
}
const matCor = {};
const lisa = cor => matCor[cor] || (matCor[cor] = new THREE.MeshLambertMaterial({ color: cor }));
function caixa(g, x0, x1, y0, y1, z0, z1, cor) {
  if (x1 - x0 <= 0 || y1 - y0 <= 0 || z1 - z0 <= 0) return;
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), lisa(cor));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = true; m.receiveShadow = true;
  g.add(m);

    <li><b>A calçada</b> é laje de 7 cm com o meio-fio de concreto e a sarjeta; o piso é cimentado ou ladrilho hidráulico na quadra de hoje, bloquete ou ladrilho na nova. Em cima: o poste de concreto num lado de cada rua (de 34 em 34 m), a árvore na cova de terra (na quadra nova; a de hoje já tem as dela), o cesto de lixo, o hidrante e a placa da rua na esquina. No chão: a faixa de pedestre rente à esquina, com o piso tátil amarelo nas pontas, e a boca de lobo na sarjeta.</li>
    <li><b>Até a rua que não tem casa do outro lado</b> (a da borda, que dá pro mato) tem calçada, meio-fio, poste e árvore.</li>
    <li><b>A grade de proteção</b> (a tela verde de poste em poste, em cima da mureta) corre toda a divisa entre a cidade e o mato: atrás da calçada da borda, em volta das favelas e do Atacadex, dos dois lados da avenida fora da cidade e na beira da areia. No cenário a pé o boneco não passa pro mato.</li>
    <li><b>As pichações</b> são das torcidas da praça (o nome, a sigla, a sigla com o ano, o grito do clube), na cor de cada uma, de quem é o bairro (perto da sede dela), e têm a altura do boneco.</li>
  </ul>
  <h3>Os bares e as sedes da torcida</h3>
  <ul>
    <li>O bar da torcida é o pequeno, de esquina: ${metros(LARG_BAR_M * M)} de frente, o térreo nas cores da torcida com a porta de enrolar e o letreiro BAR DO ${esc(ocupacao.torcidas[0] ? ocupacao.torcidas[0].sigla : 'X')}, e o apartamento em cima. Os dois primeiros ficam nas quadras dos bares grandes de hoje (2,8 e 5,1); os outros, na esquina mais longe de todo bar já posto.</li>
    <li>A sede é a do modelo novo, com cada cômodo mobiliado (a lista está na ficha da sede); o botão <b>Telhado</b>, no 3D, tira e põe o telhado. No cenário a pé as portas começam fechadas: o <b>F</b> (ou o botão que aparece perto da porta) abre e fecha.</li>
    <li>Quem ocupa cada um é a torcida da cidade escolhida. Bar que nenhuma torcida usa fica <b>neutro, de porta fechada</b>; espaço de sede sem torcida fica com a <b>sede fechada</b>, em cor de reboco.</li>
    <li><b>As rivais ficam em lados opostos do mapa</b>: a rivalidade é a dos dados das torcidas (a maior rivalidade pesa três vezes a outra; a do mesmo clube não conta), e das distribuições possíveis fica a que deixa as sedes rivais mais longe umas das outras. <b>O bar</b> fica a ${Math.round(BAR_LONGE_SEDE * escalaDoMapa())} m ou mais da sede da torcida e a ${Math.round(BAR_LONGE_RIVAL * escalaDoMapa())} m ou mais da sede de uma rival (o GDD §7.2 pede o bar noutra zona que a sede; no mapa grande, ${BAR_LONGE_SEDE} e ${BAR_LONGE_RIVAL} m, e no médio e no pequeno a distância encolhe com a cidade). Quando o mapa não tem bar que sirva, fica o que chega mais perto da regra. A tabela das torcidas mostra as duas distâncias.</li>
  </ul>
  <h3>O que muda no jogo pra fazer</h3>
  <ul>
    <li>O jogo ainda usa um mapa só, o de hoje ("Jogo hoje"). Os três mapas são da planta em HTML: pra virar jogo, a cena do dia de jogo tem de montar o mapa do porte da praça.</li>
    <li>Os estádios copiados são o mesmo estádio: a cena da torcida teria de aceitar mais de um.</li>
    <li>O shopping, a delegacia, a Praça da Vila e o metrô têm modelo (<code>equip3d.js</code> e <code>metro3d.js</code>), mas só a planta os usa. A sede nova (<code>sede3d.js</code>) também é só visual por enquanto.</li>
    <li>A regra de quem fica com o quê é desta página (as sedes rivais em lados opostos do mapa, um bar por sede, longe dela e das rivais). O mapa ainda não tem bairro nem zona: "longe" é distância em linha reta.</li>
  </ul>
  <p class="nota">Clique numa estação do metrô (o M azul), num bar, num espaço de sede, numa casa da favela, numa quadra nova, num estádio ou num pórtico pra ver em 3D.</p>`;
}
