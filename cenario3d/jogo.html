    const t0 = 0, t1 = len, ya = yb + 0.03 * M, yz = Y1 - 0.06 * M, nrm = [-u[1], 0, u[0]];

    const UV = [[t0 / TILE, 0], [t1 / TILE, 0], [t1 / TILE, (yz - ya) / TILE], [t0 / TILE, (yz - ya) / TILE]];

    geo.setAttribute('normal', new THREE.Float32BufferAttribute(L.n, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(L.c, 3));
    g.add(new THREE.Mesh(geo, matCorVertice || (matCorVertice = new THREE.MeshLambertMaterial({ vertexColors: true }))));
  }
  if (TL.p.length) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(TL.p, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(TL.n, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(TL.uv, 2));
    g.add(new THREE.Mesh(geo, MAT_TELA || (MAT_TELA = new THREE.MeshLambertMaterial({ map: texturaDaTela(), alphaTest: 0.3, alphaToCoverage: true, side: THREE.DoubleSide }))));

}
/* O MOBILIÁRIO DA CALÇADA, em cima da laje: o poste, o cesto e o

function objetoDaQuadra(q, g, nova, prop) {

  const casasDoPredio = (semPredio ? PROP.lotesDoPredio || [] : []).concat(semBaldio ? PROP.lotesDoBaldio || [] : []).filter(l => l.quadra.i === q.i && l.quadra.j === q.j);

/* ======================================================
   O CENÁRIO 3D (js/cenario.js): o mapa inteiro em 3D
   ====================================================== */
/* O QUE O CENÁRIO MONTA: cada coisa do mapa da vez com o montador dela,
   pelo mesmo filtro do desenho — o que a planta desenha, o cenário monta.
   `tipo` separa na contagem; `it` é o item da planta (o clique abre a
   ficha dele), e fica nulo no que a planta não tem ficha (a árvore, o
   carro, a peça da pracinha e da praia) */
function pecasDoCenario() {
  const out = [], poe = (tipo, it, montar) => out.push({ tipo, it, montar });
  for (const it of lotes) if (!it.sobProposta && !it.sobSede) poe(it.l.favela ? 'favela' : 'casa', it, g => objetoDoLote(it.l, g));
  for (const it of lotesNovos) if (!it.sobSede) poe(ehBar(it.l) ? 'bar' : ehLoja(it.l) ? 'loja' : 'casa', it, g => objetoDoLote(it.l, g));
  for (const it of lotesFavelaNova) if (!it.sobSede) poe('favela', it, g => objetoDoLote(it.l, g));
  for (const it of marcosDeHoje().concat(marcosNovos)) poe('marco', it, g => objetoDoMarco(it, g));
  for (const it of espacos) poe('sede', it, g => objetoDoEspaco(it, g, { telhado: true, portasVivas: true }));
  /* a rua de veraneio: cada lote com a casa dele, e os coqueiros da rua */
  for (const it of lotesVeraneio) poe('casa', it, g => objetoDoVeraneio(it.l, g));
  for (const o of coqueirosDoVeraneio()) poe('arvore', null, g => {
    const destino = {};
    montarArvoreLowpoly('coqueiro', { x: o.x, z: o.y, giro: o.giro }, destino, o.sem);
    malhasDoDestino(destino, g);
  });
  /* o marco que mora num equipamento já está nos marcos */
  for (const e of equipamentos) if (!e.somePelaProposta) poe('equipamento', e, g => objetoDoEquip(e.q.equip, g, { telhado: true, semMarco: true, portasVivas: true }));
  for (const q of PROP.quadras) {
    const e = q.equip;
    if (!e || e.tipo === 'condominio' || e.tipo === 'estadio') continue;
    const it = { tipo: 'quadraNova', q, pol: retPts(q), bb: { x0: q.x0, y0: q.y0, x1: q.x1, y1: q.y1 } };

  }

  for (const it of porticos) poe('portico', it, g => objetoDoPortico(it.p, g));

  if (CIS()) {
    for (const pl of CIS().placas) poe('prop', null, g => objetoDaPlacaEstrada(pl, g));

    <li>O shopping, a delegacia, a Praça da Vila, a igreja do norte e o metrô têm modelo (<code>equip3d.js</code> e <code>metro3d.js</code>), mas só a planta os usa. A sede nova (<code>sede3d.js</code>) também é só visual por enquanto.</li>
    <li><b>Nas cidades-modelo</b> cada bairro é um bloco de 3 × 3 quadras, e a fileira do meio é de três equipamentos (praça, escola, igreja, delegacia, hospital, em roda pela cidade); a escola e o hospital têm modelo próprio da quadra comum. Entre as cidades ligadas por estrada corre um rio, com a ponte na estrada; no mato largo, as clareiras de pasto com a lagoinha. A praça de três cidades ou mais tem de novo a entrada norte e a sul, com o pórtico — a caravana desce nelas.</li>
    <li>A regra de quem fica com o quê é desta página: cada sede num terreno do lado da zona do bairro dela (um do gerador ou um terreno de reserva), as rivais em lados opostos, e o bar no bairro que o jogo diz (a casa do bairro sem vaga vira o bar). Os bairros e as zonas vêm dos dados das praças; a favela é um bairro sozinho.</li>
  </ul>
  <p class="nota">Clique numa estação do metrô (o M azul), num bar, num espaço de sede, numa casa da favela, numa quadra nova, num estádio ou num pórtico pra ver em 3D.</p>`;
}
/* ======================================================
   COMEÇO
   ====================================================== */
const selCidade = $('sel-cidade');
/* as praças por porte: o porte decide o mapa */
{
  const opcao = n => `<option${n === cidade ? ' selected' : ''}>${esc(n)}</option>`;
  const grupos = [['Grande', 'Cidades grandes'], ['Médio', 'Cidades médias'], ['Pequeno', 'Cidades pequenas']];
  const semPorte = CIDADES.filter(([n]) => !grupos.some(([t]) => (infoDaCidade(n) || {}).tamanho === t));
  selCidade.innerHTML = grupos.map(([t, rot]) => `<optgroup label="${rot}">` +
      CIDADES.filter(([n]) => (infoDaCidade(n) || {}).tamanho === t).map(([n]) => opcao(n)).join('') + '</optgroup>').join('') +
    semPorte.map(([n]) => opcao(n)).join('');
}
selCidade.onchange = ev => mudarCidade(ev.target.value);
tamanho();
let modoSalvo = mapaDoPorte(cidade);
try { const m = localStorage.getItem('planta-modo'); if (MODOS.includes(m)) modoSalvo = m; } catch (e) {}
/* o cenário abre direto com ?cenario (ou quando a página que embrulha
   pede, `window.__CENARIO`: é o que o GitHub Pages usa). O JOGO EM 3D
   (27/09/2026) abre com ?jogo (ou `window.__JOGO`, o jogo.html do Pages):
   o cenário da praça atrás e o jogo de feed por cima (js/jogo3d.js) */
const modoJogo = PARAMS.has('jogo') || !!window.__JOGO;
const cenarioDireto = PARAMS.has('cenario') || !!window.__CENARIO || modoJogo;
if (cenarioDireto) modoSalvo = MODOS.includes(PARAMS.get('mapa')) && PARAMS.get('mapa') !== 'atual' ? PARAMS.get('mapa') : mapaDoPorte(cidade);
mudarModo(modoSalvo);
new ResizeObserver(() => { tamanho(); pedirDesenho(); }).observe(mapa);
aviso.hidden = true;
if (modoJogo) abrirJogo3d();
else if (cenarioDireto) abrirCenario(PARAMS.get('cidade') === cidade ? cidade : null, estado.modo);
else {
  /* abre com um imóvel na tela: o Residencial Bela Vista — ou, quando ele
     saiu da praça (fora do bairro Nobre), a primeira torre que ficou */
  const torres = marcosDeHoje().concat(marcosNovos).filter(m => m.pc && /^(torre|predio)/.test(m.pc.modelo));
  const inicial = torres.find(m => m.pc.modelo === 'torre2') || torres[0] || lotes[0];
  selecionar(inicial);
}
