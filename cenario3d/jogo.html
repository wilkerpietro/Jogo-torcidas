<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torcida Organizada 3D</title>
<meta name="description" content="O jogo Torcida Organizada por cima da praça em 3D: o menu, a barra de cima, os painéis e os dias passando, com a cidade da torcida atrás e os recados chegando em balão, na boca de quem os traz.">
<script>window.__JOGO = true;</script>
</head>
<body>
<title>Planta da Cidade do Estádio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --papel: #e8eae4;
  --folha: #f6f7f3;
  --tinta: #1d2420;
  --tinta-2: #56605a;
  --linha: #c7ccc4;
  --acento: #0e7a82;
  --acento-fundo: rgba(14, 122, 130, .12);
  --selecao: #d4731c;
  --ceu3d: #dfe6ea;
  --chao3d: #b9b8ae;
  --f-ui: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-texto: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-dado: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #121615; --folha: #1a1f1e; --tinta: #e2e7e3; --tinta-2: #9ba59f; --linha: #2d3534;
    --acento: #45b6be; --acento-fundo: rgba(69, 182, 190, .16); --selecao: #f09c45;
    --ceu3d: #1d2529; --chao3d: #3b3e39;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #121615; --folha: #1a1f1e; --tinta: #e2e7e3; --tinta-2: #9ba59f; --linha: #2d3534;
  --acento: #45b6be; --acento-fundo: rgba(69, 182, 190, .16); --selecao: #f09c45;
  --ceu3d: #1d2529; --chao3d: #3b3e39;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--papel); color: var(--tinta); font: 14px/1.45 var(--f-texto); }
.app {
  box-sizing: border-box; height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-inline: 16px; padding-block: 12px;
}
/* O ESTILO DA PLANTA FICA NA PLANTA (conserto de 28/09/2026): cada regra de
   classe daqui vale só dentro da .app (a planta) e da .cen-ficha (a ficha do
   cenário, que usa o mesmo HTML) — o :where não muda a força de regra
   nenhuma. O jogo 3D monta por cima desta mesma página, e .painel, .dados,
   .campo, .corpo, .nota, .topo, .acoes… são classes dele também: sem isto,
   o painel do jogo virava coluna flex, a tabela de membros saía em duas
   colunas e as caixas do Expediente em maiúsculas espaçadas. Regra nova de
   classe entra com o mesmo :where na frente. */
:where(.app, .cen-ficha) .topo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
:where(.app, .cen-ficha) .nome h1 {
  margin: 0; font: 700 24px/1.05 var(--f-ui); letter-spacing: .01em; text-wrap: balance;
}
:where(.app, .cen-ficha) .resumo { margin: 3px 0 0; font: 12px/1.3 var(--f-dado); color: var(--tinta-2); font-variant-numeric: tabular-nums; }
:where(.app, .cen-ficha) .controles { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
:where(.app, .cen-ficha) .modos { display: inline-flex; border: 1px solid var(--linha); border-radius: 8px; padding: 2px; background: var(--folha); }
:where(.app, .cen-ficha) .modos button {
  font: 600 14px/1 var(--f-ui); letter-spacing: .02em; color: var(--tinta-2); background: none;
  border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer;
}
:where(.app, .cen-ficha) .modos button[aria-selected="true"] { background: var(--tinta); color: var(--papel); }
:where(.app, .cen-ficha) .modos button:not(#aba-atual)[aria-selected="true"] { background: var(--acento); color: var(--folha); }
:where(.app, .cen-ficha) .camadas { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 13px/1 var(--f-ui); color: var(--tinta-2); }
:where(.app, .cen-ficha) .cidade { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--f-ui); letter-spacing: .02em; color: var(--tinta-2); }
:where(.app, .cen-ficha) .cidade select { font: 600 14px/1.2 var(--f-ui); letter-spacing: .01em; color: var(--tinta); background: var(--folha);
  border: 1px solid var(--linha); border-radius: 8px; padding: 6px 8px; max-width: 190px; }
:where(.app, .cen-ficha) .cidade select:focus-visible { outline: 2px solid var(--selecao); outline-offset: 2px; }
:where(.app, .cen-ficha) .camadas label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
:where(.app, .cen-ficha) .camadas input { accent-color: var(--acento); margin: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--selecao); outline-offset: 2px; }

:where(.app, .cen-ficha) .corpo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; }
:where(.app, .cen-ficha) .mapa {
  position: relative; min-height: 0; border-radius: 10px; overflow: hidden; background: #555;
  border: 1px solid var(--linha); touch-action: none; cursor: grab;
}
:where(.app, .cen-ficha) .mapa.arrastando { cursor: grabbing; }
:where(.app, .cen-ficha) .mapa canvas { display: block; width: 100%; height: 100%; }
:where(.app, .cen-ficha) .zoom { position: absolute; right: 10px; top: 30px; display: flex; flex-direction: column; gap: 4px; }
:where(.app, .cen-ficha) .zoom button {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(0,0,0,.35); cursor: pointer;
  background: rgba(246,247,243,.92); color: #1d2420; font: 600 18px/1 var(--f-ui);
}
:where(.app, .cen-ficha) .legenda {
  position: absolute; left: 30px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: calc(100% - 200px);
  padding: 6px 9px; border-radius: 8px; background: rgba(24,27,26,.78); color: #eef0ec;
  font: 500 12px/1.2 var(--f-ui); letter-spacing: .02em; pointer-events: none;
}
:where(.app, .cen-ficha) .legenda span { display: inline-flex; align-items: center; gap: 5px; }
:where(.app, .cen-ficha) .legenda i { width: 11px; height: 11px; border: 1px solid #111; display: inline-block; }
:where(.app, .cen-ficha) .legenda i.nova { border: 2px dashed #45b6be; background: transparent; }
:where(.app, .cen-ficha) .legenda i.bar { background: #c8342b; border: 2px solid #f2f1ec; border-radius: 50%; }
:where(.app, .cen-ficha) .legenda i.barf { background: #8f8a7f; border: 2px solid #3d3a35; border-radius: 50%; }
:where(.app, .cen-ficha) .legenda i.sede { background: #1f5aa8; border: 2px solid #f2f1ec; }
:where(.app, .cen-ficha) .legenda i.sedev { background: #aaa598; border: 2px dashed #57544d; }
:where(.app, .cen-ficha) .legenda i.metro { background: #1f5aa8; border: 2px solid #f2f1ec; border-radius: 50%; }
:where(.app, .cen-ficha) .legenda i.comercio { background: linear-gradient(90deg, #c0452f 0 25%, #e08a2c 25% 50%, #3f8f4a 50% 75%, #d9b331 75%); border: 2px solid #2b2118; }
:where(.app, .cen-ficha) .legenda i.estac { background: repeating-linear-gradient(90deg, #a49d8f 0 3px, #f4f3ee 3px 4px); border: 1px solid #3d3a35; }
:where(.app, .cen-ficha) .legenda i.ambulante { width: 6px; background: #c8322b; border: 1px solid #1d1a16; box-shadow: 8px 0 0 -1px #f2c230, 8px 0 0 0 #1d1a16; margin-right: 9px; }
:where(.app, .cen-ficha) .torcidas { width: 100%; border-collapse: collapse; margin: 6px 0 0; font: 13px/1.3 var(--f-texto); }
:where(.app, .cen-ficha) .torcidas th { text-align: left; font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); padding: 0 6px 4px 0; }
:where(.app, .cen-ficha) .torcidas td { padding: 4px 6px 4px 0; border-top: 1px solid var(--linha); vertical-align: top; font-variant-numeric: tabular-nums; }
:where(.app, .cen-ficha) .torcidas tr.aqui td { font-weight: 700; color: var(--acento); }
:where(.app, .cen-ficha) .torcidas .cores { display: inline-flex; gap: 2px; vertical-align: -1px; margin-right: 5px; }
:where(.app, .cen-ficha) .torcidas .cores i, :where(.app, .cen-ficha) .ficha .cores i { width: 10px; height: 10px; display: inline-block; border: 1px solid rgba(0,0,0,.45); }
:where(.app, .cen-ficha) .ficha .cores { display: inline-flex; gap: 3px; vertical-align: -1px; }
:where(.app, .cen-ficha) .ficha .escudos { display: flex; gap: 10px; align-items: center; margin: 2px 0 10px; }
:where(.app, .cen-ficha) .ficha .escudos img { width: 48px; height: 48px; object-fit: contain; }
:where(.app, .cen-ficha) .ficha .escudos span { font: 12px/1.3 var(--f-texto); color: var(--tinta-2); }
:where(.app, .cen-ficha) .regua {
  position: absolute; right: 10px; bottom: 10px; padding: 5px 8px 6px; border-radius: 8px;
  background: rgba(24,27,26,.78); color: #eef0ec; font: 11px/1 var(--f-dado); pointer-events: none;
}
:where(.app, .cen-ficha) .regua b { display: block; height: 4px; margin-bottom: 4px; background: repeating-linear-gradient(90deg, #eef0ec 0 50%, #555 50% 100%); border: 1px solid #eef0ec; }
:where(.app, .cen-ficha) .coord {
  position: absolute; left: 30px; top: 30px; padding: 4px 8px; border-radius: 6px; background: rgba(24,27,26,.72);
  color: #eef0ec; font: 11px/1.2 var(--f-dado); pointer-events: none; font-variant-numeric: tabular-nums;
}
:where(.app, .cen-ficha) .aviso {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
  background: #555; color: #eef0ec; font: 600 16px/1.4 var(--f-ui); letter-spacing: .02em;
}
:where(.app, .cen-ficha) .dica-hover {
  position: absolute; pointer-events: none; padding: 4px 7px; border-radius: 6px; background: rgba(24,27,26,.88);
  color: #fff; font: 500 12px/1.25 var(--f-ui); white-space: nowrap; transform: translate(12px, 12px);
}

:where(.app, .cen-ficha) .painel { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
:where(.app, .cen-ficha) .vista3d {
  position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--linha); background: var(--ceu3d);
  aspect-ratio: 4 / 3; max-width: 100%; flex: none;
}
:where(.app, .cen-ficha) .vista3d canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
:where(.app, .cen-ficha) .dica { position: absolute; left: 8px; bottom: 6px; margin: 0; font: 500 11px/1 var(--f-ui); color: var(--tinta-2); pointer-events: none; }
:where(.app, .cen-ficha) .alterna3d {
  position: absolute; right: 8px; top: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 8px;
  border-radius: 8px; border: 1px solid rgba(0,0,0,.35); background: rgba(246,247,243,.92); color: #1d2420;
  font: 600 13px/1 var(--f-ui); letter-spacing: .02em; cursor: pointer;
}
:where(.app, .cen-ficha) .alterna3d input { accent-color: #0e7a82; margin: 0; }
:where(.app, .cen-ficha) .alterna3d:has(input:focus-visible) { outline: 2px solid var(--selecao); outline-offset: 2px; }
:where(.app, .cen-ficha) .viagem3d { position: absolute; left: 8px; top: 8px; margin: 0; padding: 6px 10px; border-radius: 8px; background: #1f5aa8; color: #fff;
  font: 600 13px/1.2 var(--f-ui); letter-spacing: .02em; pointer-events: none; }
:where(.app, .cen-ficha) .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
:where(.app, .cen-ficha) .acoes button { font: 600 14px/1 var(--f-ui); letter-spacing: .02em; padding: 9px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--linha); background: var(--papel); color: var(--tinta); }
:where(.app, .cen-ficha) .acoes button.principal { background: #1f5aa8; border-color: #1f5aa8; color: #fff; }
:where(.app, .cen-ficha) .ficha h3 { margin: 14px 0 6px; font: 700 15px/1.2 var(--f-ui); letter-spacing: .02em; }
:where(.app, .cen-ficha) .comodos { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; color: var(--tinta-2); }
:where(.app, .cen-ficha) .comodos b { color: var(--tinta); font: 700 13.5px/1.2 var(--f-ui); letter-spacing: .02em; }
:where(.app, .cen-ficha) .comodos span { font: 12px var(--f-dado); font-variant-numeric: tabular-nums; }
:where(.app, .cen-ficha) .carregando3d { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px var(--f-ui); color: var(--tinta-2); pointer-events: none; }
:where(.app, .cen-ficha) .ficha, :where(.app, .cen-ficha) .notas { background: var(--folha); border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px; }
:where(.app, .cen-ficha) .sobre { margin: 0 0 4px; font: 600 12px/1.3 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
:where(.app, .cen-ficha) .sobre .chip { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: var(--acento); color: var(--folha); letter-spacing: .04em; }
:where(.app, .cen-ficha) .ficha h2, :where(.app, .cen-ficha) .notas h2 { margin: 0 0 10px; font: 700 21px/1.15 var(--f-ui); text-wrap: balance; }
:where(.app, .cen-ficha) .dados { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
:where(.app, .cen-ficha) .dados div { min-width: 0; }
:where(.app, .cen-ficha) .dados dt { font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
:where(.app, .cen-ficha) .dados dd { margin: 2px 0 0; font: 13px/1.3 var(--f-dado); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
:where(.app, .cen-ficha) .dados .largo { grid-column: 1 / -1; }
:where(.app, .cen-ficha) .nota { margin: 10px 0 0; color: var(--tinta-2); font-size: 13px; }
:where(.app, .cen-ficha) .ficha .refs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
:where(.app, .cen-ficha) .ficha .refs a { display: block; font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); text-decoration: none; }
:where(.app, .cen-ficha) .ficha .refs img { display: block; width: 100%; height: auto; margin-top: 4px; border-radius: 6px; border: 1px solid var(--linha); }
:where(.app, .cen-ficha) .setores-lista { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 13px; }
:where(.app, .cen-ficha) .setores-lista i { display: inline-block; width: 11px; height: 11px; margin-right: 7px; border-radius: 3px; vertical-align: -1px; }
:where(.app, .cen-ficha) .setores-lista span { font: 12px var(--f-dado); font-variant-numeric: tabular-nums; color: var(--tinta-2); }
:where(.app, .cen-ficha) .campo { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
:where(.app, .cen-ficha) .campo select { font: 500 15px/1.2 var(--f-texto); letter-spacing: 0; text-transform: none; color: var(--tinta); background: var(--papel);
  border: 1px solid var(--linha); border-radius: 8px; padding: 7px 9px; }
:where(.app, .cen-ficha) .campo select:focus-visible { outline: 2px solid var(--selecao); outline-offset: 1px; }
:where(.app, .cen-ficha) .notas h3 { margin: 14px 0 6px; font: 700 15px/1.2 var(--f-ui); letter-spacing: .02em; }
:where(.app, .cen-ficha) .notas p, :where(.app, .cen-ficha) .notas li { font-size: 13.5px; }
:where(.app, .cen-ficha) .notas ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
:where(.app, .cen-ficha) .numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
:where(.app, .cen-ficha) .numeros div { border-left: 3px solid var(--acento); padding: 2px 0 2px 8px; }
:where(.app, .cen-ficha) .numeros dt { font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
:where(.app, .cen-ficha) .numeros dd { margin: 2px 0 0; font: 600 17px/1.15 var(--f-dado); font-variant-numeric: tabular-nums; white-space: nowrap; }
:where(.app, .cen-ficha) .numeros small { font: 12px var(--f-dado); color: var(--tinta-2); }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  :where(.app, .cen-ficha) .corpo { grid-template-columns: minmax(0, 1fr); }
  :where(.app, .cen-ficha) .mapa { height: 62vh; min-height: 320px; }
  :where(.app, .cen-ficha) .legenda { left: 10px; max-width: calc(100% - 20px); bottom: 44px; }
  :where(.app, .cen-ficha) .coord { left: 10px; top: 10px; }
  :where(.app, .cen-ficha) .zoom { top: 10px; }
  :where(.app, .cen-ficha) .painel { overflow: visible; }
}
:where(.app, .cen-ficha) .bt-modelos { font: 600 14px/1 var(--f-ui); letter-spacing: .02em; color: var(--tinta-2); background: var(--folha);
  border: 1px solid var(--linha); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
:where(.app, .cen-ficha) .bt-modelos[aria-pressed="true"] { background: var(--acento); color: var(--folha); border-color: var(--acento); }
:where(.app, .cen-ficha) .bt-cenario { color: var(--folha); background: var(--acento); border-color: var(--acento); }
:where(.app, .cen-ficha) .catalogo { min-height: 0; overflow: auto; border-radius: 10px; border: 1px solid var(--linha); background: var(--folha); padding: 12px 14px; }
:where(.app, .cen-ficha) .catalogo h2 { margin: 2px 0 4px; font: 700 17px/1.2 var(--f-ui); }
:where(.app, .cen-ficha) .catalogo > p { margin: 0 0 6px; font: 13px/1.4 var(--f-texto); color: var(--tinta-2); }
:where(.app, .cen-ficha) .catalogo h3 { margin: 16px 0 6px; font: 600 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
:where(.app, .cen-ficha) .catalogo ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
:where(.app, .cen-ficha) .catalogo button { width: 100%; text-align: left; border: 1px solid var(--linha); background: var(--papel); border-radius: 8px;
  padding: 8px 10px; cursor: pointer; font: 600 14px/1.2 var(--f-ui); color: var(--tinta); }
:where(.app, .cen-ficha) .catalogo button small { display: block; margin-top: 3px; font: 400 12px/1.3 var(--f-texto); color: var(--tinta-2); }
:where(.app, .cen-ficha) .catalogo button[aria-pressed="true"] { border-color: var(--acento); box-shadow: inset 4px 0 0 var(--acento); }
.app.catalogo .mapa, .app.catalogo .notas { display: none; }
.app.catalogo .corpo { grid-template-columns: 320px minmax(0, 1fr); }
.app.catalogo .vista3d { aspect-ratio: auto; height: min(64vh, 660px); }
:where(.app, .cen-ficha) .ficha .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
:where(.app, .cen-ficha) .ficha .acoes button { font: 600 13px/1 var(--f-ui); border: 1px solid var(--linha); background: var(--papel); color: var(--tinta);
  border-radius: 7px; padding: 8px 11px; cursor: pointer; }
@media (max-width: 860px) {
  .app.catalogo .corpo { grid-template-columns: minmax(0, 1fr); }
  .app.catalogo .vista3d { height: 52vh; }
  :where(.app, .cen-ficha) .catalogo { max-height: 42vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="topo">
    <div class="nome">
      <h1>Planta da Cidade do Estádio</h1>
      <p class="resumo" id="resumo">carregando a planta…</p>
    </div>
    <div class="controles">
      <label class="cidade">Cidade <select id="sel-cidade"></select></label>
      <div class="modos" role="tablist" aria-label="Qual mapa">
        <button role="tab" id="aba-pequeno" aria-selected="false">Pequeno</button>
        <button role="tab" id="aba-medio" aria-selected="false">Médio</button>
        <button role="tab" id="aba-grande" aria-selected="true">Grande</button>

      const cx = ux.reduce((t, u) => t + u.cx * u.peso, 0) / a, cy = ux.reduce((t, u) => t + u.cy * u.peso, 0) / a;

    if (k === undefined) continue;

      const i0 = Math.max(0, Math.floor((r.x0 - L.x0) / CEL_SETOR)), i1 = Math.min(nx - 1, Math.floor((r.x1 - L.x0) / CEL_SETOR));
      const j0 = Math.max(0, Math.floor((r.y0 - L.y0) / CEL_SETOR)), j1 = Math.min(ny - 1, Math.floor((r.y1 - L.y0) / CEL_SETOR));

}
/* O NOME DA FAVELA é o do bairro dela (o dono, 01/10/2026: "os nomes

/* AS CORES DOS BAIRROS no mapa: sem o jogo, a cor da zona; o jogo põe a
